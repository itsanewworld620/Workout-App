}
function labelMode(m){
  const map={incline_walk:'Incline walk', bike:'Bike', rower:'Rower', stairs:'Stairs', carry:'Carries'};
  return map[m]||m;
}

/* Typed duration, offered on every timed screen alongside the timer.
   [Running a timer is one way to know how long something took; it is not the
   only way, and it is often not available — phone in a pocket, walk already
   finished, machine's own display, a session logged after the fact. A screen
   whose only affordance is START forces a clock to be re-run for a walk that
   already happened.] A typed value always beats the timer. */
function manualTimeCard(){
  const v = (sessionState && sessionState.min!=null) ? sessionState.min : '';
  return `
    <div class="card">
      <div class="card-title" style="font-size:17px;margin-bottom:8px;">Or type the time</div>
      <div class="bw-row">
        <input type="number" inputmode="numeric" id="session-min" class="bw-input"
               placeholder="min" value="${v}" oninput="setSessionMin(this.value)">
        <span class="bw-avg">minutes</span>
      </div>
      <div class="microcopy mt8">Skip the timer entirely — whatever you type here is what gets logged.</div>
    </div>`;
}
function setSessionMin(v){
  if(!sessionState) return;
  const n = parseInt(v);
  sessionState.min = (v==='' || isNaN(n)) ? null : n;
  persistActive('session');
}
/* Resolve a session's duration: typed value wins, then the timer, then the default. */
function resolveMinutes(timer, fallback){
  if(sessionState && sessionState.min!=null) return sessionState.min;
  if(timer && timer.elapsedSec()>0) return timer.minutes();
  return fallback;
}
/* Weighted vest (v1.6.0, Joel's request). Field starts blank so a vest-less
   walk never silently logs one; the saved default is one tap away. Typing a
   weight makes it the new default. Blank = no vest. */
/* `key` is the sessionState field the vest writes to: `vest` for cardio,
   `finisherVest` for the strength finisher / EMOM walk (v2.1). Never both on
   one screen, so the element ids can stay shared. */
function vestFields(key){
  key = key||'vest';
  const prefs = store.get('prefs')||{};
  const v = sessionState && sessionState[key]!=null ? sessionState[key] : '';
  const chip = (prefs.vestLb && v==='')
    ? `<button class="chip" id="vest-chip" onclick="applyVestDefault('${key}')">Vest ${prefs.vestLb} lb</button>` : '';
  return `
      <div class="card-title" style="font-size:17px;margin-bottom:8px;">Weighted vest</div>
      <div class="bw-row">
        <input type="number" inputmode="decimal" id="vest-lb" class="bw-input" placeholder="none"
               value="${v}" oninput="setVest(this.value,'${key}')">
        <span class="bw-avg">lb</span>
        ${chip}
      </div>
      <div class="microcopy mt8">Blank = no vest. A typed weight becomes your default.</div>`;
}
function vestCard(key){ return `<div class="card">${vestFields(key)}</div>`; }
function setVest(v, key){
  if(!sessionState) return;
  const n = parseFloat(v);
  sessionState[key||'vest'] = (v==='' || isNaN(n)) ? null : n;
  persistActive('session');
}
/* Vest worn on the finisher walk, or null. A worn weight becomes the default,
   same as cardio. */
function finisherVestLb(){
  const v = sessionState && sessionState.finisherVest;
  if(v==null || !(v>0)) return null;
  const prefs = store.get('prefs')||{};
  prefs.vestLb = v;
  store.set('prefs', prefs);
  return v;
}
function applyVestDefault(key){
  key = key||'vest';
  const prefs = store.get('prefs')||{};
  if(!prefs.vestLb || !sessionState) return;
  sessionState[key] = prefs.vestLb;
  const el = document.getElementById('vest-lb');
  if(el) el.value = prefs.vestLb;
  const chip = document.getElementById('vest-chip');
  if(chip) chip.remove();
  persistActive('session');
}
function setCardioMode(v){ if(sessionState){ sessionState.mode = v; persistActive('session'); } }
function toggleCardioTimer(){ cardioTimer.toggle(); persistActive('session'); }
function finishCardioSession(defaultMin){
  cardioTimer.stop();
  const el = document.getElementById('cardio-mode');
  const mode = el ? el.value : (sessionState.mode||'incline_walk');
  const minutes = resolveMinutes(cardioTimer, defaultMin);
  const cw = {mode, min: minutes};
  if(sessionState.vest!=null && sessionState.vest>0){
    cw.vest = sessionState.vest;
    const prefs = store.get('prefs')||{};
    prefs.vestLb = sessionState.vest;    // last worn weight becomes the default
    store.set('prefs', prefs);
  }
  const draft = {
    date: sessionState.date || todayStr(),
    slot: 'C',
    readiness: sessionState.variant.readiness,
    work: [cw],
    // Always carry the duration on the draft. Cardio has no meaningful
    // wall-clock elapsed (the session screen is a mode picker), so falling
    // through to Date.now()-startedAt seeded the Finish screen with 1 min.
    min: minutes,
    startedAt: sessionState.startedAt
  };
  const cs = stepsDraft(); if(cs) draft.steps = cs;
  if(sessionState.manual) draft.manual = true;
  // Timer kept (stopped, not reset) so Finish → Back restores it; a fresh session resets it (v2.1).
  Nav.toFinish(draft);
}

function renderRecSession(){

  // Mobility ticks live in state, not only in the DOM, so they survive a resume.

      </button>

  return `
    <div class="screen active" style="padding-bottom:100px;">
      <div class="flex-between mt8" style="margin-bottom:12px;">

        <span class="badge red">RED — recovery session</span>
      </div>
      <div class="card center">
        <div class="card-title" style="font-size:17px;">Incline walk</div>
        <div class="timer-pill mt8" id="rec-timer">00:00</div>

function toggleRecCheck(i, el){
  sessionState.recChecks[i] = !sessionState.recChecks[i];
  el.classList.toggle('logged', sessionState.recChecks[i]);
  persistActive('session');
}
function toggleRecTimer(){ recTimer.toggle(); persistActive('session'); }
function finishRecSession(){
  recTimer.stop();
  const minutes = resolveMinutes(recTimer, 20);
  const draft = {
    date: sessionState.date || todayStr(),
    slot: 'REC',
    readiness: sessionState.variant.readiness,
    work: [{mode:'recovery', min: minutes}],

    startedAt: sessionState.startedAt
  };

  // Timer kept (stopped, not reset) so Finish → Back restores it; a fresh session resets it (v2.1).
  Nav.toFinish(draft);
}

/* ================= MVS (minimum viable session) ================= */
// Reached from a strength day's "No gym today" link. Readiness is answered
// first (same as any session); the picker then chooses the tier. All three
// tiers log slot:"MVS" with mvsType and count identically toward streak,
// consistency, and the §4 MVS rules. Outdoor logs no work array.
function renderMvsPicker(variant){
  return `
    <div class="screen active">
      <div class="flex-between mt8" style="margin-bottom:12px;">
        <h1 class="title" style="margin-bottom:0;">No Gym</h1>
        <span class="badge neutral">MVS</span>
      </div>
      <div class="card"><div class="sub">Pick a minimum session. Each counts as a full completion — no makeups, no penalty.</div></div>
      <button class="pill-btn accent mt12" onclick="pickMvs('gym')">GYM CIRCUIT</button>
      <button class="pill-btn accent mt12" onclick="pickMvs('travel')">TRAVEL / BODYWEIGHT</button>
      <button class="pill-btn accent mt12" onclick="pickMvs('outdoor')">OUTDOOR WALK</button>
      <div class="microcopy mt16 center">Gym and Travel are short circuits. Outdoor is a 20-min walk.</div>
    </div>`;
}
function pickMvs(type){
  const r = sessionState && sessionState.variant ? sessionState.variant.readiness : null;
  const d = sessionState ? sessionState.date : todayStr();
  const man = sessionState ? !!sessionState.manual : false;
  const ei = sessionState && sessionState.editingIndex!=null ? sessionState.editingIndex : null;
  const off = !!(sessionState && sessionState.variant && sessionState.variant.offPlan);   // v2.1
  sessionState = null;   // drop the picker's state so the real session builds fresh
  const v = {kind:'MVS', mvsType:type, readiness:r, date:d, manual:man, editingIndex:ei};
  if(off) v.offPlan = true;
  Nav.toSession(v);
}

function renderMvsSession(variant){
  if(variant.mvsType==='outdoor') return renderMvsOutdoor(variant);
  return renderMvsCircuit(variant);
}

function mvsTargetText(it){
  if(it.durationMin!=null) return `${it.durationMin} min walk`;
  if(it.durationSec!=null) return `${it.durationSec}s hold`;
  if(it.trips!=null) return `${it.trips} trips${it.weight!=null?` @ ${it.weight} lb`:''}`;
  if(it.reps!=null) return `${it.reps} reps${it.weight!=null?` @ ${it.weight} lb`:''}`;
  return '';
}
function renderMvsCircuit(variant){
  const cfg = store.get('config');
  const list = (variant.mvsType==='gym' ? (cfg&&cfg.mvsGym) : (cfg&&cfg.mvsTravel)) || [];
  // Preserve tapped state across a resume — `logged` lives in state, not the DOM.
  if(!sessionState.mvsItems){
    sessionState.mvsItems = list.map(it=>({
      id:it.id, name:it.name, target:mvsTargetText(it), sets: it.sets||1,
      logged: new Array(it.sets||1).fill(false)
    }));
  }
  const label = variant.mvsType==='gym' ? 'MVS — GYM' : 'MVS — TRAVEL';
  const html = sessionState.mvsItems.map((it,i)=>{
    let rows='';
    for(let s=0;s<it.sets;s++){
      const done = (it.logged||[])[s];
      rows += `
        <div class="set-row">
          <button class="tap-circle${done?' logged':''}" id="mcirc-${i}-${s}" onclick="logMvsSet(${i},${s})">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
          </button>
          <span class="set-num">${s+1}</span>
          <span class="spacer"></span>
          <span class="row">${it.target}</span>
        </div>`;
    }
    return `<div class="card ex-card"><div class="card-header"><div class="card-title">${it.name}</div></div>${rows}</div>`;
  }).join('');
  return `
    <div class="screen active" style="padding-bottom:100px;">
      <div class="flex-between mt8" style="margin-bottom:12px;">
        <h1 class="title" style="margin-bottom:0;">MVS</h1>
        <span class="badge neutral">${label}</span>
      </div>
      <div id="rest-timer-wrap"></div>
      ${html}
      <div class="microcopy mt8 center">Effort cap RPE 6–7. No progression.</div>
    </div>
    <div class="sticky-bar"><div class="sticky-bar-inner">
      <button class="pill-btn accent" onclick="finishMvsCircuit()">FINISH SESSION</button>
    </div></div>`;
}
function logMvsSet(i,s){
  const circ = document.getElementById(`mcirc-${i}-${s}`);
  if(!circ) return;
  circ.classList.add('logged');
  if(sessionState.mvsItems && sessionState.mvsItems[i]){
    if(!sessionState.mvsItems[i].logged) sessionState.mvsItems[i].logged = [];
    sessionState.mvsItems[i].logged[s] = true;
  }
  startRestTimer(60);
  persistActive('session');
}
function finishMvsCircuit(){
  clearInterval(restTimerInterval); restTimerInterval=null; restEndAt=null;
  const work = (sessionState.mvsItems||[]).map(it=>({ex:it.id, target:it.target}));
  const draft = {
    date: sessionState.date || todayStr(),
    slot: 'MVS',
    mvsType: sessionState.variant.mvsType,
    readiness: sessionState.variant.readiness,
    work,
    startedAt: sessionState.startedAt
  };
  if(sessionState.manual){ draft.manual = true; draft.min = 20; }
  Nav.toFinish(draft);
}

function renderMvsOutdoor(variant){
  if(!(sessionState && sessionState.restored)) outdoorTimer.reset();
  return `
    <div class="screen active" style="padding-bottom:100px;">
      <div class="flex-between mt8" style="margin-bottom:12px;">
        <h1 class="title" style="margin-bottom:0;">Outdoor</h1>
        <span class="badge neutral">MVS — OUTDOOR</span>
      </div>
      <div class="card center">
        <div class="card-title" style="font-size:17px;">Brisk walk</div>
        <div class="timer-pill mt8" id="outdoor-timer">00:00</div>
        <div class="mt16"><button class="pill-btn accent small" id="outdoor-toggle" onclick="toggleOutdoorTimer()">START</button></div>
        <div class="microcopy mt12">20-min minimum · easy — RPE 5 or under.</div>
      </div>
      ${manualTimeCard()}
    </div>
    <div class="sticky-bar"><div class="sticky-bar-inner">
      <button class="pill-btn accent" onclick="finishMvsOutdoor()">FINISH SESSION</button>
    </div></div>`;
}
function toggleOutdoorTimer(){ outdoorTimer.toggle(); persistActive('session'); }
function finishMvsOutdoor(){
  outdoorTimer.stop();
  const minutes = resolveMinutes(outdoorTimer, 20);
  const draft = {
    date: sessionState.date || todayStr(),
    slot: 'MVS',
    mvsType: 'outdoor',
    readiness: sessionState.variant.readiness,
    min: minutes,          // outdoor has no work array; the walk time is the whole session
    startedAt: sessionState.startedAt
  };
  if(sessionState.manual) draft.manual = true;
  // Timer kept (stopped, not reset) so Finish → Back restores it; a fresh session resets it (v2.1).
  Nav.toFinish(draft);
}

/* ================= FINISH ================= */
let finishDraft = null;
function renderFinish(draft){
  finishDraft = draft;
  if(sessionState){ sessionState.finishDraft = draft; persistActive('finish'); }
  const isManual = !!draft.manual;
  const elapsedMin = draft.min!=null
    ? draft.min
    : Math.max(1, Math.round((Date.now()-draft.startedAt)/60000));
  let rpeDots='';
  for(let i=1;i<=10;i++){
    const sel = (selectedRPE===i) ? ' selected' : '';
    rpeDots += `<button class="dot${sel}" style="width:36px;height:36px;font-size:14px;" data-rpe="${i}" onclick="setRPE(${i})">${i}</button>`;
  }
  // Manual and edited sessions have no timer to trust, so duration is typed.
  // Duration is always typeable. A timer that wasn't running is the normal case
  // — phone in a pocket on a walk, or a session started before the app was open
  // — and the app cannot know the number, so it must not refuse the correction.
  const durationCard = `
    <div class="card">
      <div class="card-title" style="font-size:17px;margin-bottom:8px;">Duration (min)</div>
      <input type="number" inputmode="numeric" id="finish-min" value="${elapsedMin}" style="width:120px;">
      <div class="microcopy mt8">${isManual ? 'Type what it actually was.' : 'From the timer — change it if that\'s not right.'}</div>
    </div>`;
  const banner = isManual
    ? `<div class="banner">Logging ${draft.date} from memory. Marked as a manual entry.</div>` : '';
  return `
    <div class="screen active">
      ${banner}
      <button id="finish-back" onclick="backToSession()" style="background:none;border:0;color:var(--accent);font-weight:700;font-size:15px;padding:2px 0 10px;cursor:pointer;">‹ Back to session</button>
      <h1 class="title">Finish</h1>
      <div class="card">
        <div class="card-title" style="font-size:17px;">Session RPE</div>
        <div class="dots mt8" style="flex-wrap:wrap;">${rpeDots}</div>
        <div class="microcopy mt8">9–10 means you broke the cap.</div>
      </div>
      ${durationCard}
      <div class="card">
        <div class="card-title" style="font-size:17px;margin-bottom:8px;">Note (optional)</div>
        <textarea class="wos-textarea" id="finish-note" style="min-height:60px;">${draft.note||''}</textarea>
      </div>
    </div>
    <div class="sticky-bar"><div class="sticky-bar-inner">
      <button class="pill-btn accent" id="save-btn" onclick="saveSession(${elapsedMin})">SAVE</button>
    </div></div>
  `;
}
/* v2.1: Finish → Back, before anything is saved. Goes through the same path as
   Resume, so every tap, typed value and paused timer comes back exactly. */
function backToSession(){
  const a = store.get('active');
  if(!a){ Nav.home(); return; }
  a.screen = 'session'; a.finishDraft = null;
  store.set('active', a);
  finishDraft = null;
  Nav.toSession(a.variant, a);
  // After the screen exists, so the paused clock shows its time and RESUME.
  cardioTimer.restore(a.timers && a.timers.cardio);
  recTimer.restore(a.timers && a.timers.rec);
  outdoorTimer.restore(a.timers && a.timers.outdoor);
  finisherTimer.restore(a.timers && a.timers.finisher);
  persistActive('session');
}
let selectedRPE = null;
function setRPE(v){
  selectedRPE = v;
  document.querySelectorAll('[data-rpe]').forEach(d=>d.classList.toggle('selected', parseInt(d.dataset.rpe)===v));
  persistActive('finish');
}
function saveSession(elapsedMin){
  const sessions = store.get('sessions')||[];
  const noteEl = document.getElementById('finish-note');
  const note = noteEl ? noteEl.value : '';
  const minEl = document.getElementById('finish-min');
  const min = (minEl && minEl.value) ? parseInt(minEl.value) : elapsedMin;
  // Cardio and recovery carry their duration twice: session-level `min` and
  // work[0].min, which is what wos-review reads for those slots. An edited
  // duration has to land in both or the log disagrees with itself.
  let work = finishDraft.work;
  if(work && work.length===1 && work[0] && work[0].mode && work[0].min!=null){
    work = [Object.assign({}, work[0], {min})];
  }
  const rec = {
    date: finishDraft.date,
    slot: finishDraft.slot,
    readiness: finishDraft.readiness,
    work,
    rpe: selectedRPE,
    min,
    note
  };
  if(finishDraft.mvsType) rec.mvsType = finishDraft.mvsType; // gym|travel|outdoor
  if(finishDraft.finisher) rec.finisher = finishDraft.finisher; // {mode, min, vest?} — strength, or EMOM walk (v2.1)
  if(finishDraft.emomId) rec.emomId = finishDraft.emomId;       // v2.0 EMOM
  if(finishDraft.rounds!=null) rec.rounds = finishDraft.rounds; // v2.0 EMOM
  if(finishDraft.warm) rec.warm = finishDraft.warm;             // v2.0 warmup completion
  if(finishDraft.steps) rec.steps = finishDraft.steps;          // v2.0 per-session steps
  if(finishDraft.manual) rec.manual = true;

  const editIdx = (sessionState && sessionState.editingIndex!=null) ? sessionState.editingIndex : null;
  // v2.1: picked something other than the Recommended session. An edit keeps
  // whatever the record already said.
  const pickedOff = !!(sessionState && sessionState.variant && sessionState.variant.offPlan);
  const wasOff = editIdx!=null && sessions[editIdx] && sessions[editIdx].offPlan;
  if(pickedOff || wasOff) rec.offPlan = true;
  if(editIdx!=null && sessions[editIdx]){
    rec.manual = true;              // an edited record is no longer a pure live log
    sessions[editIdx] = rec;
  } else {
    sessions.push(rec);
  }
  store.set('sessions', sessions);

  // Lift state is derived, never patched — replay from the log so an edit or an
  // out-of-order backfill lands correctly.
  recomputeLifts();

  selectedRPE=null;
  finishDraft=null;
  sessionState=null;
  clearActive();
  Nav.home();
}
function findExDef(cfg, exId){
  if(!cfg||!cfg.workouts) return null;
  for(const k in cfg.workouts){
    const found = cfg.workouts[k].find(e=>e.id===exId);
    if(found) return found;
  }
  return null;
}

/* ================= MANUAL ENTRY / EDIT =================
   Records what happened; it does not invent what didn't. system-design §4 bans
   makeup sessions, and manual entry is exactly the door one would walk through,
   so three guards apply: a 7-day backfill window, one record per date, and the
   manual:true flag that keeps "logged from memory" auditable in the data. */
const BACKFILL_DAYS = 7;
let manualDraft = {date:null, slot:null, mvsType:null, readiness:null, dontRemember:false};

function renderManual(params){
  params = params || {};
  if(params.editingIndex!=null) return renderManualForEdit(params.editingIndex);

  manualDraft = {date:null, slot:null, mvsType:null, readiness:null, dontRemember:false};
  const sessions = store.get('sessions')||[];
  const taken = {};
  sessions.forEach(s=>{ taken[s.date]=s.slot; });

  let dayOpts = '';
  for(let i=1;i<=BACKFILL_DAYS;i++){
    const d = addDays(todayStr(), -i);
    const isTaken = !!taken[d];
    dayOpts += `<button class="pill-btn ${isTaken?'disabled':'ghost'} mt8" ${isTaken?'':`onclick="manualPickDate('${d}')"`}>
      ${fmtDateHeader(d)}${isTaken?` — already logged (${taken[d]})`:''}
    </button>`;
  }
  const todayTaken = !!taken[todayStr()];
  const todayBtn = `<button class="pill-btn ${todayTaken?'disabled':'ghost'} mt8" ${todayTaken?'':`onclick="manualPickDate('${todayStr()}')"`}>
      Today${todayTaken?` — already logged (${taken[todayStr()]})`:''}
    </button>`;

  return `
    <div class="screen active">
      <h1 class="title">Log a past session</h1>
      <div class="card">
        <div class="sub">Which day?</div>
        <div class="microcopy mt8">Last ${BACKFILL_DAYS} days only. One session per day. This records a session you actually did — it is not a makeup for one you missed.</div>
      </div>
      ${todayBtn}
      ${dayOpts}
      <button class="pill-btn ghost mt16" onclick="Nav.home()">CANCEL</button>
    </div>`;
}

function manualPickDate(d){
  manualDraft.date = d;
  const app = document.getElementById('app');
  const cfg = store.get('config');
  const sched = cfg && cfg.schedule ? cfg.schedule[dowKey(d)] : null;
  const suggested = sched==='S' ? `Strength ${nextStrengthLetter(d)}` : (sched==='C' ? 'Cardio' : 'Rest day');
  app.innerHTML = `
    <div class="screen active">
      <h1 class="title">${fmtDateHeader(d)}</h1>
      <div class="card"><div class="sub">Schedule said: ${suggested}</div>
        <div class="microcopy mt8">Pick what you actually did.</div></div>
      <button class="pill-btn ghost mt8" onclick="manualPickSlot('A')">STRENGTH A</button>
      <button class="pill-btn ghost mt8" onclick="manualPickSlot('B')">STRENGTH B</button>
      <button class="pill-btn ghost mt8" onclick="manualPickSlot('C')">CARDIO</button>
      <button class="pill-btn ghost mt8" onclick="manualPickSlot('MVS')">MVS</button>
      <button class="pill-btn ghost mt8" onclick="manualPickSlot('REC')">RECOVERY</button>
      <button class="pill-btn ghost mt16" onclick="Nav.toManual({})">BACK</button>
    </div>`;
}

function manualPickSlot(slot){
  manualDraft.slot = slot;
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="screen active">
      <h1 class="title">Readiness</h1>
      <div class="card">
        <div class="sub">How did you feel that day?</div>
        <div class="microcopy mt8">If you don't remember, say so — invented numbers corrupt the soreness and readiness rules that read this.</div>
        ${readinessQ('sleep','Sleep last night')}
        ${readinessQ('sore','Soreness / joint feel')}
        ${readinessQ('energy','Energy and mood')}
      </div>
      <button class="pill-btn accent mt12" id="manual-next" onclick="manualProceed(false)">CONTINUE</button>
      <button class="pill-btn ghost mt8" onclick="manualProceed(true)">DON'T REMEMBER</button>
    </div>`;
  readinessAns = {sleep:null, sore:null, energy:null};
}

function manualProceed(dontRemember){
  const {sleep,sore,energy} = readinessAns;
  let r = null;
  if(!dontRemember){
    if(!sleep||!sore||!energy){ alertMsg('Answer all three, or tap "Don\'t remember".'); return; }
    r = computeReadiness(sleep,sore,energy);
  }
  const d = manualDraft.date, slot = manualDraft.slot;
  const base = {readiness:r, date:d, manual:true, editingIndex:null};

  if(slot==='A' || slot==='B'){
    // A manual strength session renders full set rows so it feeds progression
    // like any live session. Degraded only if a remembered readiness says so.
    Nav.toSession(Object.assign({kind:'STRENGTH', letter:slot, degraded: !!(r && r.state==='YELLOW')}, base));
  } else if(slot==='C'){
    Nav.toSession(Object.assign({kind:'CARDIO', degraded: !!(r && r.state==='YELLOW')}, base));
  } else if(slot==='MVS'){
    Nav.toSession(Object.assign({kind:'MVS_PICK'}, base));
  } else {
    Nav.toSession(Object.assign({kind:'REC'}, base));
  }
}

function renderManualForEdit(idx){
  const sessions = store.get('sessions')||[];
  const s = sessions[idx];
  if(!s){ Nav.toHistory(); return ''; }
  const r = s.readiness;
  const base = {readiness:r, date:s.date, manual:true, editingIndex:idx, existing:s};
  setTimeout(()=>{
    if(s.slot==='A' || s.slot==='B'){
      // Render the full set count, not the YELLOW-reduced one — editing must be
      // able to reach every set that was actually logged.
      Nav.toSession(Object.assign({kind:'STRENGTH', letter:s.slot, degraded:false}, base));
    } else if(s.slot==='C'){
      Nav.toSession(Object.assign({kind:'CARDIO', degraded:false}, base));
    } else if(s.slot==='MVS'){
      Nav.toSession(Object.assign({kind:'MVS', mvsType:s.mvsType||'gym'}, base));
    } else {
      Nav.toSession(Object.assign({kind:'REC'}, base));
    }
  },0);
  return `<div class="screen active"><div class="microcopy mt16 center">Opening session…</div></div>`;
}

/* ================= HISTORY ================= */
function sessionSummary(s){
  if(s.slot==='C'){
    const w=(s.work||[])[0]||{};
    const vest = w.vest ? ` · vest ${w.vest} lb` : '';
    return `${labelMode(w.mode||'')} · ${s.min||w.min||0} min${vest}`;
  }
  if(s.slot==='REC') return `Recovery · ${s.min||0} min`;
  if(s.slot==='MVS') return `MVS ${s.mvsType||''} · ${s.min||0} min`;
  const n=(s.work||[]).reduce((a,w)=>a+((w.sets||[]).length),0);
  const fin = s.finisher ? ` · finisher ${s.finisher.min} min` : '';
  return `${n} set${n===1?'':'s'} · ${s.min||0} min${fin}`;
}

function renderHistory(){
  const sessions = (store.get('sessions')||[])
    .map((s,i)=>({s,i}))
    .filter(o=>o.s.date >= addDays(todayStr(),-28))
    .sort((a,b)=> a.s.date < b.s.date ? 1 : (a.s.date > b.s.date ? -1 : 0));

  const rows = sessions.length ? sessions.map(o=>{
    const s=o.s;
    const flag = s.manual ? `<span class="badge neutral" style="margin-left:6px;">manual</span>` : '';
    const state = s.readiness ? s.readiness.state : null;
    const badge = state ? `<span class="badge ${state.toLowerCase()}">${state}</span>` : `<span class="badge neutral">—</span>`;
    return `
      <div class="list-row" style="cursor:pointer;" onclick="openSessionDetail(${o.i})">
        <div class="list-tile">${s.slot}</div>
        <div style="flex:1;">
          <div class="list-title">${fmtDateHeader(s.date)}${flag}</div>
          <div class="microcopy">${sessionSummary(s)}</div>
        </div>
        ${badge}
      </div>`;
  }).join('') : `<div class="microcopy mt8">No sessions in the last 28 days.</div>`;

  return `
    <div class="screen active">
      <h1 class="title">History</h1>
      <div class="card">${rows}</div>
      <button class="pill-btn ghost mt12" onclick="Nav.tab('progress')">BACK TO PROGRESS</button>
    </div>`;
}

function openSessionDetail(idx){
  const sessions = store.get('sessions')||[];
  const s = sessions[idx];
  if(!s) return;
  let work = '';
  if(s.slot==='A'||s.slot==='B'){
    const cfg = store.get('config');
    work = (s.work||[]).map(w=>{
      const def = findExDef(cfg,w.ex);
      const sets = (w.sets||[]).map(x=>`${x[0]}×${x[1]}`).join('  ');
      return `<div class="list-row"><div class="list-title">${def?def.name:w.ex}</div><div class="list-trailing">${sets||'—'}</div></div>`;
    }).join('');
    if(s.finisher){
      work += `<div class="list-row"><div class="list-title">Finisher — ${labelMode(s.finisher.mode)}</div><div class="list-trailing">${s.finisher.min} min</div></div>`;
    }
  } else {
    work = `<div class="list-row"><div class="list-title">${sessionSummary(s)}</div></div>`;
  }
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="screen active">
      <h1 class="title">${fmtDateHeader(s.date)}</h1>
      <div class="card">
        <div class="flex-between">
          <div class="card-title" style="font-size:17px;">${s.slot}${s.mvsType?' — '+s.mvsType:''}</div>
          ${s.manual?'<span class="badge neutral">manual</span>':''}
        </div>
        <div class="microcopy mt8">RPE ${s.rpe||'—'} · ${s.min||0} min · readiness ${s.readiness?s.readiness.state:'not recorded'}</div>
        ${s.note?`<div class="microcopy mt8">"${s.note}"</div>`:''}
      </div>
      <div class="card">${work}</div>
      <button class="pill-btn accent mt12" onclick="Nav.toManual({editingIndex:${idx}})">EDIT</button>
      <button class="pill-btn ghost mt8" onclick="deleteSession(${idx})">DELETE</button>
      <button class="pill-btn ghost mt16" onclick="Nav.toHistory()">BACK</button>
    </div>`;
}

function deleteSession(idx){
  confirmSheet('Delete this session?',
    'It comes out of your streak and consistency, and lift weights recalculate from what remains.',
    'DELETE', 'CANCEL',
    ()=>{
      const sessions = store.get('sessions')||[];
      sessions.splice(idx,1);
      store.set('sessions', sessions);
      recomputeLifts();
      Nav.toHistory();
    });
}

/* ================= PROGRESS ================= */
function renderProgress(){
  const sessions = store.get('sessions')||[];
  const daily = (store.get('daily')||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  const weekly = (store.get('weekly')||[]).slice().sort((a,b)=>a.weekOf<b.weekOf?-1:1);

  // 4-week consistency
  // Window is the same 28 days the denominator walks (today-27..today) — the two
  // used to disagree by a day, which let one extra session into the numerator.
  const since = addDays(todayStr(), -27);
  const recent = sessions.filter(s=>s.date>=since && s.slot!=='SKIP');
  // Denominator computed from the schedule, not hardcoded — a partial history,
  // a changed schedule, or a deleted session all have to report honestly.
  const scheduledCount = scheduledCountLast28();
  const consistency = scheduledCount
    ? Math.min(100, Math.round((recent.length/scheduledCount)*100))
    : 0;
  const streak = currentStreak();
  // The bare ratio read like a weekly target ("6 of 7" → "am I meant to train
  // 7 days?"). It carries its window now, and says so honestly when the history
  // is shorter than the window.
  const progMeta = store.get('meta') || {};
  const windowLabel = (progMeta.startDate && progMeta.startDate > since)
    ? 'since ' + fmtShortDate(progMeta.startDate)
    : 'last 4 weeks';

  /* Weight chart plots the ROLLING 7-DAY AVERAGE, not raw daily weigh-ins —
     system-design §2 says the average is the only number reviews look at, and
     the spec bans a daily-weight chart anywhere (daily noise on a months-scale
     goal manufactures discouragement). Through v1.5.3 this plotted raw dailies. */
  const avgSeries = daily.map(d=>{
    const from = addDays(d.date,-6);
    const win = daily.filter(x=>x.date>=from && x.date<=d.date);
    const avg = win.reduce((a,x)=>a+x.bw,0)/win.length;
    return {x:d.date, y: Math.round(avg*10)/10};
  }).slice(-56);

  const bwNow = avgSeries.length ? avgSeries[avgSeries.length-1].y : null;
  const bwStart = avgSeries.length ? avgSeries[0].y : null;
  const bwDelta = (bwNow!=null && bwStart!=null) ? Math.round((bwNow-bwStart)*10)/10 : null;
  const bwCard = `
    <div class="card">
      <div class="flex-between">
        <div class="card-title" style="font-size:17px;">Body weight</div>
        <div class="stat-value" style="font-size:26px;">${bwNow!=null?bwNow.toFixed(1):'—'}<span class="unit" style="font-size:13px;"> lb</span></div>
      </div>
      <div class="microcopy">7-day average${bwDelta!=null?` · ${fmtDelta(bwDelta)} lb since start`:''}</div>
      ${avgSeries.length ? sparkline(avgSeries,'--accent','lb') : '<div class="microcopy mt8">No data yet.</div>'}
    </div>`;

  const waistNow = weekly.length ? weekly[weekly.length-1].waist : null;
  const waistStart = weekly.length ? weekly[0].waist : null;
  const waistDelta = (waistNow!=null && waistStart!=null) ? Math.round((waistNow-waistStart)*10)/10 : null;
  const waistCard = `
    <div class="card">
      <div class="flex-between">
        <div class="card-title" style="font-size:17px;">Waist</div>
        <div class="stat-value" style="font-size:26px;">${waistNow!=null?waistNow:'—'}<span class="unit" style="font-size:13px;"> in</span></div>
      </div>
      <div class="microcopy">weekly, at the navel${waistDelta!=null?` · ${fmtDelta(waistDelta)} in since start`:''}</div>
      ${weekly.length ? sparkline(weekly.slice(-8).map(w=>({x:w.weekOf,y:w.waist})),'--accent','in') : '<div class="microcopy mt8">No data yet.</div>'}
    </div>`;

  // Per-lift cards: labeled, with the current number printed. "Dots" alone told
  // Joel nothing — every chart now says what it plots and where the lift stands.
  const cfg = store.get('config');
  const lifts = store.get('lifts')||{};
  let liftCharts = '';
  if(cfg && cfg.workouts){
    const allEx = [...(cfg.workouts.A||[]), ...(cfg.workouts.B||[])];
    liftCharts = allEx.map(ex=>{
      const points = [];
      sessions.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(s=>{
        (s.work||[]).forEach(w=>{
          if(w.ex===ex.id && w.sets && w.sets.length){
            points.push({x:s.date, y:w.sets[0][0]});
          }
        });
      });
      const last8 = points.slice(-8);
      if(!last8.length) return '';
      const st = lifts[ex.id]||{};
      const now = st.lastWeight!=null ? st.lastWeight : last8[last8.length-1].y;
      const started = last8[0].y;
      const unit = ex.repHi==null ? 'lb' : 'lb';
      return `
        <div class="card">
          <div class="flex-between">
            <div class="card-title" style="font-size:17px;">${ex.name}</div>
            <div class="stat-value" style="font-size:26px;">${now}<span class="unit" style="font-size:13px;"> ${unit}</span></div>
          </div>
          <div class="microcopy">top-set weight (${unit}) · last ${last8.length} session${last8.length===1?'':'s'} · started ${started} ${unit}</div>
          ${sparkline(last8,'--accent',unit)}
        </div>`;
    }).join('');
  }

  return `
    <div class="screen active">
      <h1 class="title">Progress</h1>
      <div class="card">
        <div class="stat-row">
          <div class="stat-block"><div class="stat-label">4-wk consistency</div><div class="stat-value">${consistency}%</div></div>
          <div class="stat-block"><div class="stat-label">Streak</div><div class="stat-value">${streak}</div></div>
        </div>
        <div class="microcopy mt8 center">${recent.length} of ${scheduledCount} scheduled &middot; ${windowLabel}</div>
      </div>
      <button class="pill-btn ghost" onclick="Nav.toHistory()">VIEW &amp; EDIT HISTORY</button>
      ${bwCard}
      ${waistCard}

/* Sparkline v2: connected line + dots, dashed gridlines, y-axis min/max labels
   and first/last values so the chart carries its own numbers. */
function sparkline(points, colorVar, unit){
  if(!points.length) return '<div class="microcopy mt8">No data yet.</div>';
  const w=300, h=96, padL=34, padR=10, padT=14, padB=16;
  const ys = points.map(p=>p.y).filter(y=>y!=null);
  if(!ys.length) return '<div class="microcopy mt8">No data yet.</div>';
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const range = maxY-minY || 1;
  const plotW = w-padL-padR, plotH = h-padT-padB;
  const stepX = points.length>1 ? plotW/(points.length-1) : 0;
  const coords = points.map((p,i)=>{
    const x = padL + (points.length>1 ? i*stepX : plotW/2);
    const y = h-padB - ((p.y-minY)/range)*plotH;
    return [Math.round(x*10)/10, Math.round(y*10)/10];
  });
  const line = coords.length>1
    ? `<polyline points="${coords.map(c=>c.join(',')).join(' ')}" fill="none" stroke="var(${colorVar})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : '';
  const dots = coords.map(c=>`<circle cx="${c[0]}" cy="${c[1]}" r="3" fill="var(${colorVar})"/>`).join('');
  let gridlines='';
  for(let i=0;i<3;i++){
    const gy = padT + i*(plotH/2);
    gridlines += `<line x1="${padL}" y1="${gy}" x2="${w-padR}" y2="${gy}" stroke="var(--line)" stroke-width="1" stroke-dasharray="3,3"/>`;
  }
  const yLabels = `
    <text x="${padL-5}" y="${padT+4}" class="chart-label" text-anchor="end">${maxY}</text>
    <text x="${padL-5}" y="${h-padB+4}" class="chart-label" text-anchor="end">${minY}</text>`;
  const lastPt = coords[coords.length-1];
  const lastLabel = `<text x="${Math.min(lastPt[0], w-padR-2)}" y="${Math.max(padT-3, lastPt[1]-7)}" class="chart-label" text-anchor="end" style="font-weight:700; fill:var(--text);">${points[points.length-1].y}</text>`;
  return `<div class="chart-wrap"><svg class="chart" viewBox="0 0 ${w} ${h}">${gridlines}${line}${dots}${yLabels}${coords.length>1?lastLabel:''}</svg></div>`;
}

function importProgram(){

}
function applyProgramImport(raw){
  let cfg;
  try{ cfg = JSON.parse(raw); }catch(e){ alertMsg('Invalid JSON.'); return; }
  // Accept both a raw config and a { "config": {...} } wrapper — wos-program
  // has produced both shapes; unwrap so either imports cleanly.
  if(cfg && cfg.config && !cfg.schedule) cfg = cfg.config;
  if(!cfg.schedule || !cfg.workouts){ alertMsg('Config missing schedule/workouts.'); return; }
  if(confirm('Overwrite current program with imported config?')){

function downloadBackup(){
  const data = {
    config: store.get('config'),
    lifts: store.get('lifts'),
    sessions: store.get('sessions'),
    daily: store.get('daily'),
    weekly: store.get('weekly'),
    meta: store.get('meta'),
    appVersion: APP_VERSION,
    exportDate: todayStr()
  };
  const meta = store.get('meta');
  meta.lastBackup = todayStr();
  store.set('meta', meta);
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'wos-backup.json';

  URL.revokeObjectURL(url);

function restoreBackup(){
  const fileInput = document.getElementById('restore-file');
  if(fileInput.files && fileInput.files[0]){
    const reader = new FileReader();
    reader.onload = (e)=>{
      applyRestore(e.target.result);
    };
    reader.readAsText(fileInput.files[0]);
    return;
  }
  const raw = document.getElementById('restore-textarea').value.trim();
  if(raw) applyRestore(raw);
}
function applyRestore(raw){
  let data;
  try{ data = JSON.parse(raw); }catch(e){ alertMsg('Invalid JSON.'); return; }
  if(!data.meta || !('sessions' in data)){ alertMsg('Not a valid WOS backup.'); return; }
  if(!confirm('This will overwrite all current data. Continue?')) return;
  store.set('config', data.config||null);
  store.set('lifts', data.lifts||{});
  store.set('sessions', data.sessions||[]);
  store.set('daily', data.daily||[]);
  store.set('weekly', data.weekly||[]);
  store.set('meta', data.meta||{startDate:todayStr(), appVersion:APP_VERSION, lastBackup:null});
  // A restored store must not inherit this device's half-finished session, and
  // lifts are rebuilt from the restored log rather than trusting the backup's copy.
  clearActive(); sessionState=null;
  recomputeLifts();
  alertMsg('Restored.');
  Nav.home();

let exTimers={};
function exDurStart(idx, secs){
  const cur=exTimers[idx]; const remain=(cur&&cur.remain)||secs*1000;
  if(cur&&cur.run) return;
  exTimers[idx]={end:Date.now()+remain, run:true, raf:null};
  (function loop(){ const t=exTimers[idx]; if(!t||!t.run) return; const el=document.getElementById('exdur-'+idx); if(!el){t.run=false;return;} const left=t.end-Date.now(); if(left<=0){ beep(); el.textContent='0:00'; t.run=false; return; } const s=Math.ceil(left/1000); el.textContent=Math.floor(s/60)+':'+pad(s%60); t.raf=requestAnimationFrame(loop); })();
}
function exDurReset(idx, secs){ const t=exTimers[idx]; if(t){ t.run=false; if(t.raf) cancelAnimationFrame(t.raf); } exTimers[idx]=null; const el=document.getElementById('exdur-'+idx); if(el) el.textContent='0:'+pad(secs); }

/* ---- EMOM (Leevi's path — time-based, every minute) ---- */
let emomInterval=null;
let emomLastPaint=null;   // wall-clock time of the previous repaint; a big gap means the phone just woke
let emomLastCue=null;     // "idx:sec" of the last countdown beep, so each fires once
function emomWorkout(id){ const cfg=store.get('config'); return ((cfg&&cfg.emom&&cfg.emom.workouts)||[]).find(w=>w.id===id)||null; }
/* EMOM of the week (v2.1). The week runs Monday–Sunday. The first EMOM logged
   in a week sets it for that week — whether the app or Joel picked it — and any
   later different EMOM that week is a one-off that changes nothing. With none
   logged yet this week: the one after the most recent earlier week's FIRST
   EMOM, so a missed week never skips a workout. Replaces the per-session
   rotation (Joel, 2026-09-30). */
function weekStartOf(dateStr){ const d=new Date(dateStr+'T12:00:00'); return addDays(dateStr, -((d.getDay()+6)%7)); }
function weekEmomId(dateStr){
  const cfg=store.get('config'); const ws=(cfg&&cfg.emom&&cfg.emom.workouts)||[]; if(!ws.length) return null;
  const wk=weekStartOf(dateStr||todayStr());
  const done=(store.get('sessions')||[]).filter(s=>s.slot==='EMOM' && s.emomId)
    .sort((a,b)=> a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
  const thisWeek=done.find(s=>s.date>=wk && s.date<=addDays(wk,6));
  if(thisWeek) return thisWeek.emomId;
  const prior=done.filter(s=>s.date<wk);
  if(!prior.length) return ws[0].id;
  const lastWk=weekStartOf(prior[prior.length-1].date);
  const anchor=prior.find(s=>s.date>=lastWk);
  const i=ws.findIndex(w=>w.id===anchor.emomId);
  return ws[(i+1)%ws.length].id;   // an id no longer in the program (i = -1) restarts at the first
}
function nextEmomId(){ return weekEmomId(todayStr()); }
function renderEmomSession(variant){

  const em=sessionState.emom;

    ${stepsCard()}
    <div class="sticky-bar"><div class="sticky-bar-inner"><button class="pill-btn accent" onclick="finishEmomSession()">FINISH</button></div></div>
  </div>`;

function emomPaint(){
  const em=sessionState&&sessionState.emom; if(!em) return;
  const w=emomWorkout(em.emomId)||{ex:[]}; const per=w.ex.length||6; const total=em.rounds*per;
  const clock=document.getElementById('emom-clock'); if(!clock) return;
  // Beeps fire only live. A long gap since the last repaint means the phone
  // slept; a beep now would be late, so stay quiet (same guard as the rest timer).
  const now=Date.now();
  const live = emomLastPaint!=null && now-emomLastPaint < 1500;
  emomLastPaint = now;
  if(em.done){ emomShowDone(); return; }
  let left = em.running&&em.endAt ? em.endAt-now : (em.remain!=null?em.remain:60000);
  if(em.running && left<=0){
    if(live) beep();
    em.idx++;
    if(em.idx>=total){ emomComplete(); return; }
    em.endAt=now+60000; left=60000; persistActive('session');
  }
  const s=Math.max(0,Math.ceil(left/1000));
  // v2.1 (session note 8/25): short beep at 3, 2, 1 seconds left in each minute.
  if(em.running && live && s>=1 && s<=3){
    const cue=em.idx+':'+s;
    if(cue!==emomLastCue){ emomLastCue=cue; beep(120, 660); }
  }
  clock.textContent=Math.floor(s/60)+':'+pad(s%60);
  const round=Math.floor(em.idx/per)+1; const cur=w.ex[em.idx%per]||{name:'—'}; const nx=(em.idx+1<total)?(w.ex[(em.idx+1)%per]||{name:'—'}).name:'Done';
  const r=document.getElementById('emom-round'); if(r) r.textContent='Round '+round+' of '+em.rounds;
  const n=document.getElementById('emom-now'); if(n) n.textContent=cur.name;
  const nn=document.getElementById('emom-next'); if(nn) nn.textContent='Next · '+nx;
}
/* v2.1 (session notes 8/18, 8/20): the last minute ends ON the EMOM screen.
   Nothing leaves the screen until FINISH — the walk block opens instead. */
function emomComplete(){
  const em=sessionState.emom;
  em.running=false; em.done=true; em.endAt=null; em.remain=null;
  clearInterval(emomInterval); emomInterval=null;
  persistActive('session');
  emomShowDone();
}
function emomShowDone(){
  const set=(id,t)=>{ const el=document.getElementById(id); if(el) el.textContent=t; };
  set('emom-clock','0:00'); set('emom-round','All rounds done'); set('emom-now','EMOM done');
  set('emom-next','Walk below if you want, then FINISH.');
  emomShowControls(true);
}
function emomShowControls(done){
  const show=(id,on)=>{ const el=document.getElementById(id); if(el) el.style.display=on?'':'none'; };
  show('emom-start',!done); show('emom-drop',!done);
  const wk=document.getElementById('emom-walk'); if(wk) wk.style.display=done?'block':'none';
}
function emomToggle(){
  const em=sessionState.emom; if(em.done) return;
  const btn=document.getElementById('emom-start');
  if(!em.running){ em.running=true; em.endAt=Date.now()+(em.remain!=null?em.remain:60000); em.remain=null; emomLastPaint=Date.now(); clearInterval(emomInterval); emomInterval=setInterval(emomPaint,250); if(btn) btn.textContent='PAUSE'; }
  else { em.running=false; em.remain=Math.max(0,em.endAt-Date.now()); clearInterval(emomInterval); emomInterval=null; if(btn) btn.textContent='RESUME'; }
  persistActive('session'); emomPaint();
}
function emomReset(){ const em=sessionState.emom; em.idx=0; em.endAt=null; em.remain=null; em.running=false; em.done=false; clearInterval(emomInterval); emomInterval=null; emomShowControls(false); const b=document.getElementById('emom-start'); if(b) b.textContent='START'; persistActive('session'); emomPaint(); }
function emomDrop(){ const em=sessionState.emom; if(em.done) return; if(em.rounds>2){ em.rounds--; const w=emomWorkout(em.emomId)||{ex:[]}; if(em.idx>=em.rounds*(w.ex.length||6)){ emomComplete(); return; } persistActive('session'); emomPaint(); } }
function emomOpenVideo(){ const em=sessionState.emom; if(em.done) return; const w=emomWorkout(em.emomId)||{ex:[]}; const per=w.ex.length||6; const e=w.ex[em.idx%per]; if(e&&e.url) window.open(e.url,'_blank'); }
function finishEmomSession(){
  clearInterval(emomInterval); emomInterval=null;
  const em=sessionState.emom;
  // Pause rather than lose a running minute — Back from Finish resumes here.
  if(em.running){ em.running=false; em.remain=Math.max(0,em.endAt-Date.now()); em.endAt=null; }
  finisherTimer.stop();
  const walkMin = sessionState.finisherMin!=null
    ? sessionState.finisherMin
    : (finisherTimer.elapsedSec()>0 ? finisherTimer.minutes() : 0);
  const draft={ date:sessionState.date||todayStr(), slot:'EMOM', emomId:em.emomId, rounds:em.rounds, readiness:(sessionState.variant&&sessionState.variant.readiness)||null, startedAt:sessionState.startedAt, min:Math.max(1,em.idx)+walkMin };
  // The walk is part of the session (Joel, 2026-09-30): logged as the finisher, minutes in the total.
  if(walkMin>0){
    draft.finisher={ mode:'walk', min:walkMin };
    const fv=finisherVestLb(); if(fv) draft.finisher.vest=fv;
  }
  const es = stepsDraft(); if(es) draft.steps = es;
  Nav.toFinish(draft);
}

/* ================= boot ================= */
ensureInit();
migrateV20();   // v2.0 additive schema backfill (safe, adds absent keys only)
/* Version migration: on any app update, refresh meta.appVersion (it sat stale
   at 1.3.0 through two review cycles) and rebuild the lifts cache so shape
   changes (v1.6.0 added lastWeight/lastReps/advanced) land without waiting for
   the next save. recomputeLifts is cheap and idempotent. */
(function versionMigrate(){
  const meta = store.get('meta');
  if(meta && meta.appVersion !== APP_VERSION){
    meta.appVersion = APP_VERSION;
    store.set('meta', meta);
    recomputeLifts();
  }
})();
Nav.home();
// An unfinished session from a previous day gets offered, never silently dropped.
checkStaleActive();
</script>
