<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0C0E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>WOS</title>
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22WOS%22%2C%22short_name%22%3A%22WOS%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230B0C0E%22%2C%22theme_color%22%3A%22%230B0C0E%22%2C%22icons%22%3A%5B%5D%7D">
<style>
:root{
  --bg:#0B0C0E; --surface:#1F2227; --surface-2:#17191D; --chip:#2E3238; --line:#3A3E44;
  --text:#FFFFFF; --text-2:#9AA0A8; --text-3:#5C636B;
  --accent:#3F5BFF; --accent-down:#3249D1; --on-accent:#FFFFFF;
  --green:#3DBE7B; --yellow:#E8B93B; --red:#E05A5A; --on-state:#0B0C0E;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums; overscroll-behavior-y:none;}
body{padding-bottom:calc(84px + var(--safe-b));}
button{font-family:inherit;}
.screen{display:none; padding:16px; max-width:520px; margin:0 auto;}
.screen.active{display:block;}
h1.title{font-size:32px; font-weight:800; text-transform:uppercase; letter-spacing:-0.5px; margin:8px 0 16px;}
.card{background:var(--surface); border-radius:20px; padding:20px; margin-bottom:12px;}
.card-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
.card-title{font-size:22px; font-weight:700;}
.chevron{color:var(--text-2); font-size:20px;}
.accent-card{background:var(--accent); color:#fff;}
.accent-card .card-title, .accent-card .sub{color:#fff;}
.sub{font-size:15px; font-weight:500; color:var(--text-2);}
.microcopy{font-size:13px; font-weight:500; color:var(--text-2);}
.row{font-size:17px; font-weight:600;}
.pill-btn{border:none; border-radius:999px; font-weight:700; font-size:18px; padding:16px 20px;
  width:100%; height:60px; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
  transition:transform 120ms ease-out, opacity 120ms ease-out;}
.pill-btn:active{transform:scale(0.96);}
.pill-btn.accent{background:var(--accent); color:#fff;}
.pill-btn.disabled{background:var(--chip); color:var(--text-3); pointer-events:none;}
.pill-btn.green{background:var(--green); color:#fff;}
.pill-btn.yellow{background:var(--yellow); color:var(--on-state);}
.pill-btn.red{background:var(--red); color:#fff;}
.pill-btn.white-inv{background:#fff; color:var(--accent);}
.pill-btn.small{height:44px; font-size:15px;}
.pill-btn.ghost{background:var(--surface-2); color:var(--text);}

.bw-row{display:flex; align-items:center; gap:12px;}
.bw-input{background:var(--surface-2); border:none; border-radius:16px; color:var(--text);
  font-size:26px; font-weight:700; padding:12px 16px; width:120px; text-align:center;}
.bw-avg{font-size:15px; color:var(--text-2); font-weight:500;}

.readiness-q{margin-top:16px;}
.readiness-label{font-size:17px; font-weight:600; margin-bottom:10px;}
.dots{display:flex; gap:8px;}
.dot{width:44px; height:44px; border-radius:50%; background:var(--chip); color:var(--text-2);
  display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:700; cursor:pointer;
  border:none; transition:transform 120ms ease-out;}
.dot:active{transform:scale(0.92);}
.dot.selected{background:var(--accent); color:#fff;}

.banner{background:var(--surface); border-left:3px solid var(--yellow); border-radius:4px; padding:12px 14px;
  font-size:15px; margin-bottom:12px; cursor:pointer;}

/* set rows */
.set-row{background:var(--surface-2); border-radius:16px; padding:12px 14px; display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.tap-circle{width:28px; height:28px; min-width:28px; border-radius:50%; border:2px solid var(--text-3);
  display:flex; align-items:center; justify-content:center; cursor:pointer; background:transparent;}
.tap-circle.logged{background:var(--accent); border-color:var(--accent);}
.tap-circle svg{width:16px; height:16px; display:none;}
.tap-circle.logged svg{display:block;}
.set-num{color:var(--text-2); font-size:15px; font-weight:600; min-width:14px;}
.chip{background:var(--chip); border-radius:12px; padding:8px 10px; font-weight:700; font-size:16px; border:none; color:var(--text); cursor:pointer;}
.unit{color:var(--text-2); font-size:13px; font-weight:500;}
.spacer{flex:1;}

.ex-card{margin-bottom:12px;}
.ex-cue{font-size:13px; color:var(--text-2); margin:2px 0 12px;}
.ex-target{font-size:15px; color:var(--text-2); margin-bottom:12px;}

.timer-pill{background:var(--surface-2); border-radius:999px; padding:10px 18px; display:inline-flex; align-items:center; gap:8px; font-size:40px; font-weight:700;}
.timer-pill.final{color:var(--accent);}

.sticky-bar{position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(12px + var(--safe-b)); background:var(--bg); border-top:1px solid var(--line); z-index:20;}
.sticky-bar-inner{max-width:520px; margin:0 auto;}

.tabbar{position:fixed; left:0; right:0; bottom:0; background:var(--bg); border-top:1px solid var(--line);
  display:flex; padding-bottom:var(--safe-b); z-index:20;}
.tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:10px 0 8px; color:var(--text-2); cursor:pointer; border:none; background:none;}
.tab.active{color:var(--accent);}
.tab svg{width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:2;}
.tab-label{font-size:12px; font-weight:600;}

.stat-row{display:flex; gap:0;}
.stat-block{flex:1; padding:12px 8px; text-align:center; border-right:1px solid var(--line);}
.stat-block:last-child{border-right:none;}
.stat-label{font-size:15px; color:var(--text-2); margin-bottom:4px;}
.stat-value{font-size:32px; font-weight:700; color:var(--accent);}

.week-strip{display:flex; gap:8px; justify-content:space-between; margin-bottom:8px;}
.wk-dot{width:40px; height:40px; border-radius:50%; background:var(--chip); color:var(--text-3);
  display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700;}
.wk-dot.today{background:#fff; color:#000;}
.wk-dot.done{background:var(--accent); color:#fff;}
.wk-dot.missed{background:var(--surface-2); color:var(--text-3);}

.chart-wrap{margin-top:8px;}
svg.chart{width:100%; display:block;}
.chart-label{font-size:12px; fill:var(--text-2); font-weight:500;}

.list-row{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line);}
.list-row:last-child{border-bottom:none;}
.list-tile{width:48px; height:48px; border-radius:16px; background:var(--chip); display:flex; align-items:center; justify-content:center; color:var(--text-2); font-weight:700;}
.list-title{font-size:17px; font-weight:600; flex:1;}
.list-trailing{color:var(--text-2); font-size:15px;}

.toggle{width:52px; height:32px; border-radius:999px; background:var(--chip); position:relative; border:none; cursor:pointer; flex:none;}
.toggle.on{background:var(--accent);}
.toggle-thumb{position:absolute; top:2px; left:2px; width:28px; height:28px; border-radius:50%; background:#fff; transition:transform 150ms ease-out;}
.toggle.on .toggle-thumb{transform:translateX(20px);}

textarea.wos-textarea{width:100%; background:var(--surface-2); border:none; border-radius:16px; color:var(--text);
  font-family:inherit; font-size:14px; padding:12px; min-height:120px; resize:vertical;}
input[type=text], input[type=number]{background:var(--surface-2); border:none; border-radius:16px; color:var(--text); font-size:17px; padding:12px; font-family:inherit;}

.hr{height:1px; background:var(--line); margin:14px 0; border:none;}
.mono-small{font-size:13px; color:var(--text-2); font-family:ui-monospace,monospace;}
.center{text-align:center;}
.mt8{margin-top:8px;} .mt12{margin-top:12px;} .mt16{margin-top:16px;} .mt20{margin-top:20px;}
.hidden{display:none !important;}
.rest-label{font-size:13px; color:var(--text-2);}
.flex-between{display:flex; align-items:center; justify-content:space-between;}
.badge{font-size:12px; font-weight:700; padding:3px 8px; border-radius:999px; text-transform:uppercase;}
.badge.green{background:var(--green); color:#fff;}
.badge.yellow{background:var(--yellow); color:var(--on-state);}
.badge.red{background:var(--red); color:#fff;}
.badge.neutral{background:var(--chip); color:var(--text-2);}
.nogym-link{display:inline-block; margin-top:12px; color:#fff; opacity:0.9; text-decoration:underline; font-weight:600; cursor:pointer;}
.modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:flex-end; justify-content:center; z-index:50;}
.modal-sheet{background:var(--surface); width:100%; max-width:520px; border-radius:20px 20px 0 0; padding:20px; padding-bottom:calc(24px + var(--safe-b));}
.link{color:var(--accent); font-weight:600; cursor:pointer; text-decoration:none;}
select{background:var(--surface-2); color:var(--text); border:none; border-radius:16px; padding:12px; font-size:17px; font-family:inherit; width:100%;}
</style>
</head>
<body>

<div id="app"></div>

<div id="tabbar" class="tabbar">
  <button class="tab active" data-tab="home" onclick="Nav.tab('home')">
    <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    <span class="tab-label">Home</span>
  </button>
  <button class="tab" data-tab="workouts" onclick="Nav.tab('workouts')">
    <svg viewBox="0 0 24 24"><path d="M4 9v6M7 8v8M17 8v8M20 9v6M7 12h10"/></svg>
    <span class="tab-label">Workouts</span>
  </button>
  <button class="tab" data-tab="progress" onclick="Nav.tab('progress')">
    <svg viewBox="0 0 24 24"><path d="M4 19V9"/><path d="M11 19V5"/><path d="M18 19v-7"/></svg>
    <span class="tab-label">Progress</span>
  </button>
  <button class="tab" data-tab="settings" onclick="Nav.tab('settings')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V21a2 2 0 11-4 0v-.09A1.7 1.7 0 009 19.4a1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.7 1.7 0 004.6 15a1.7 1.7 0 00-1.55-1H3a2 2 0 110-4h.09A1.7 1.7 0 004.6 9a1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06A1.7 1.7 0 009 4.6a1.7 1.7 0 001-1.55V3a2 2 0 114 0v.09a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06A1.7 1.7 0 0019.4 9a1.7 1.7 0 001.55 1H21a2 2 0 110 4h-.09a1.7 1.7 0 00-1.51 1z"/></svg>
    <span class="tab-label">Settings</span>
  </button>
</div>

<script>
'use strict';
const APP_VERSION = '2.1.0';

/* ---------- wall-clock timers ----------
   All in-session timers derive their value from Date.now() timestamps, never
   from a counter incremented per tick. Mobile browsers throttle/suspend
   setInterval when the screen sleeps or the tab is backgrounded; a counter
   would freeze and under-count. Here the interval only repaints — the numbers
   come from wall-clock math, so they stay correct across sleep, and a
   visibilitychange/pageshow/focus handler snaps the display on wake. */
function makeCountUp(displayId, toggleBtnId){
  return {
    accMs:0, segStart:null, interval:null, running:false,
    elapsedSec(){ return Math.floor((this.accMs + (this.running ? Date.now()-this.segStart : 0))/1000); },
    render(){ const el=document.getElementById(displayId); if(el){ const t=this.elapsedSec(); el.textContent = pad(Math.floor(t/60))+':'+pad(t%60); } },
    toggle(){
      const btn=document.getElementById(toggleBtnId);
      if(this.running){ this.accMs += Date.now()-this.segStart; this.segStart=null; this.running=false; clearInterval(this.interval); this.interval=null; if(btn) btn.textContent='RESUME'; }
      else { this.segStart=Date.now(); this.running=true; clearInterval(this.interval); this.interval=setInterval(()=>this.render(),250); if(btn) btn.textContent='PAUSE'; this.render(); }
    },
    stop(){ if(this.running){ this.accMs += Date.now()-this.segStart; this.segStart=null; this.running=false; } clearInterval(this.interval); this.interval=null; },
    minutes(){ return Math.round(this.elapsedSec()/60); },
    reset(){ this.accMs=0; this.segStart=null; this.running=false; clearInterval(this.interval); this.interval=null; },
    /* Serialize/restore for session resume. accMs + segStart are wall-clock
       values, so a timer that was running when the app died keeps counting
       across the gap — which is correct: the walk/rest really did continue. */
    serialize(){ return {accMs:this.accMs, segStart:this.segStart, running:this.running}; },
    restore(o){
      if(!o) return;
      this.accMs = o.accMs||0; this.segStart = o.segStart||null; this.running = !!o.running;
      clearInterval(this.interval); this.interval=null;
      if(this.running){
        if(this.segStart==null) this.segStart = Date.now();
        this.interval = setInterval(()=>this.render(),250);
      }
      this.render();
      const btn = document.getElementById(toggleBtnId);
      if(btn) btn.textContent = this.running ? 'PAUSE' : (this.accMs>0 ? 'RESUME' : 'START');
    }
  };
}
const cardioTimer   = makeCountUp('cardio-timer','cardio-toggle');
const recTimer      = makeCountUp('rec-timer','rec-toggle');
const outdoorTimer  = makeCountUp('outdoor-timer','outdoor-toggle');
const finisherTimer = makeCountUp('finisher-timer','finisher-toggle');

function refreshTimers(){
  try{
    if(restEndAt!=null) renderRestTimer();
    cardioTimer.render(); recTimer.render(); outdoorTimer.render(); finisherTimer.render();
  }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refreshTimers(); });
window.addEventListener('pageshow', refreshTimers);
window.addEventListener('focus', refreshTimers);

/* ---------- Storage adapter ---------- */
const store = {
  get(k){ const v = localStorage.getItem("wos."+k); return v ? JSON.parse(v) : null; },
  set(k,v){ localStorage.setItem("wos."+k, JSON.stringify(v)); }
};

function ensureInit(){
  if(!store.get('meta')) store.set('meta', { startDate: todayStr(), appVersion: APP_VERSION, lastBackup: null });
  if(!store.get('lifts')) store.set('lifts', {});
  if(!store.get('sessions')) store.set('sessions', []);
  if(!store.get('daily')) store.set('daily', []);
  if(!store.get('weekly')) store.set('weekly', []);
  if(!store.get('config')) store.set('config', null);
  if(!store.get('notes')) store.set('notes', []);        // v2.0: general notes
  if(localStorage.getItem('wos.active')===null) store.set('active', null);
}

/* v2.0 additive migration: adds the new schema keys/fields without touching any
   existing data. `notes[]` is ensured in ensureInit; here we backfill the new
   config fields (`url` per exercise, `emom` block) on an already-imported config.
   Only adds absent keys — never rewrites values. */
function migrateV20(){
  const cfg = store.get('config');
  if(!cfg) return;
  let changed = false;
  if(cfg.workouts){
    for(const k in cfg.workouts){
      (cfg.workouts[k]||[]).forEach(e=>{ if(!('url' in e)){ e.url = null; changed = true; } });
    }
  }
  if(!('emom' in cfg)){ cfg.emom = null; changed = true; }   // filled by wos-program import
  if(changed) store.set('config', cfg);
}

/* ---------- replay engine ----------
   `sessions` is the single source of truth; `lifts` is a derived cache.
   recomputeLifts() rebuilds lifts from scratch: every lift starts at its
   config startWeight, then sessions are walked in DATE order applying double
   progression (system-design §5). This is what makes editing a saved session
   safe — lift state is recomputed, never patched. Incremental updates and an
   editable log cannot coexist; they drift, and the drift is silent. */
function progressionAdvances(exDef, sets){
  // A set advances the lift only if every set hit the top of its target.
  // Duration-based lifts (farmer carry) have repHi:null and gate on durationSec.
  // Never compare against a null repHi — JS coerces null to 0, making the test
  // unconditionally true and adding load every session with no gate at all.
  if(!sets || !sets.length) return false;
  if(exDef && exDef.repHi==null){
    const target = exDef.durationSec;
    if(target==null) return false;       // no gate definable -> never auto-advance
    return sets.every(s=>(s[1]||0) >= target);
  }
  const repHi = exDef ? exDef.repHi : 12;
  if(repHi==null) return false;
  return sets.every(s=>(s[1]||0) >= repHi);
}

function recomputeLifts(){
  const cfg = store.get('config');
  const lifts = {};
  if(!cfg || !cfg.workouts){ store.set('lifts', lifts); return lifts; }

  const allEx = [];
  for(const k in cfg.workouts) (cfg.workouts[k]||[]).forEach(e=>allEx.push(e));
  // Shape (v1.6.0): weight = next GREEN target (last actual + increment when the
  // lift advanced), lastWeight = what was actually lifted, lastReps = actual reps
  // per set, advanced = whether double progression fired. lastWeight/lastReps
  // exist so YELLOW and soreness-freeze sessions can pre-fill *without* the bump
  // (§4: no load progression on those days) and so reps carry forward instead of
  // resetting to repLo every session.
  allEx.forEach(ex=>{ lifts[ex.id] = { weight: ex.startWeight||0, lastWeight: null, lastReps: [], advanced: false }; });

  const sessions = (store.get('sessions')||[]).slice()
    .sort((a,b)=> a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));

  sessions.forEach(s=>{
    if(s.slot!=='A' && s.slot!=='B') return;   // only strength work drives progression
    (s.work||[]).forEach(w=>{
      if(!w.sets || !w.sets.length) return;
      const exDef = findExDef(cfg, w.ex);
      if(!exDef) return;
      // incrementLb:0 is a real value meaning "never add load" (dead bug). The
      // old `|| 5` fallback turned 0 into 5 and quietly progressed a bodyweight
      // core drill — visible in the 07-31 backup as dead_bug at 15 lb.
      const increment = (exDef.incrementLb!=null ? exDef.incrementLb : 5);
      const lastWeight = w.sets[0][0];
      const advanced = progressionAdvances(exDef, w.sets) && increment>0;
      lifts[w.ex] = {
        weight: advanced ? lastWeight + increment : lastWeight,
        lastWeight,
        lastReps: w.sets.map(x=>x[1]),
        lastSets: w.sets.map(x=>[x[0],x[1]]),
        advanced
      };
    });
  });

  store.set('lifts', lifts);
  return lifts;
}

/* §4 soreness freeze: soreness answer ≤2 (stored scale, 1 = very sore) on two
   sessions running freezes all loads for one week from the second session.
   Readiness:null sessions are skipped — never invent a readiness number. */
function sorenessFreezeActive(dateStr){
  const ss = (store.get('sessions')||[])
    .filter(s=>s.readiness && s.readiness.sore!=null)
    .slice()
    .sort((a,b)=> a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
  for(let i=ss.length-1; i>0; i--){
    const freezeEnd = addDays(ss[i].date, 7);
    if(freezeEnd <= dateStr) break;   // older pairs can't cover this date
    if(ss[i].readiness.sore<=2 && ss[i-1].readiness.sore<=2) return true;
  }
  return false;
}

/* ---------- live session persistence ----------
   In-session state is never held only in memory. Every mutation writes to
   `active` immediately, so a back press, refresh, or crash loses nothing.
   [Through v1.4.0 sessionState was a module-level variable and the first
   localStorage write happened at Save on Screen 3 — one Android back press
   destroyed the entire session. Hard requirement: do not regress this.] */
function persistActive(screen){
  if(!sessionState) return;
  const snap = {
    date: sessionState.date || todayStr(),
    screen: screen || sessionState.screen || 'session',
    variant: sessionState.variant,
    startedAt: sessionState.startedAt,
    restEndAt: restEndAt,
    note: sessionState.note || '',
    manual: !!sessionState.manual,
    editingIndex: (sessionState.editingIndex!=null ? sessionState.editingIndex : null),
    exercises: sessionState.exercises ? sessionState.exercises.map(r=>({ex:r.ex, weight:r.weight, sets:r.sets, prefillReps:r.prefillReps||null, prefillWeights:r.prefillWeights||null})) : null,
    mvsItems: sessionState.mvsItems || null,
    recChecks: sessionState.recChecks || null,
    warmChecks: sessionState.warmChecks || null,
    steps: sessionState.steps || null,
    emom: sessionState.emom || null,
    mode: sessionState.mode || null,
    min: sessionState.min!=null ? sessionState.min : null,
    vest: sessionState.vest!=null ? sessionState.vest : null,
    finisherMode: sessionState.finisherMode || null,
    finisherMin: sessionState.finisherMin!=null ? sessionState.finisherMin : null,
    finisherVest: sessionState.finisherVest!=null ? sessionState.finisherVest : null,
    frozen: !!sessionState.frozen,
    finishDraft: sessionState.finishDraft || null,
    rpe: (typeof selectedRPE!=='undefined' ? selectedRPE : null),
    timers: {
      cardio: cardioTimer.serialize(),
      rec: recTimer.serialize(),
      outdoor: outdoorTimer.serialize(),
      finisher: finisherTimer.serialize()
    }
  };
  store.set('active', snap);
}
function clearActive(){ store.set('active', null); }

/* ---------- date helpers ---------- */
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function pad(n){ return n<10 ? '0'+n : ''+n; }
function dowKey(dateStr){
  const days=['sun','mon','tue','wed','thu','fri','sat'];
  const d=new Date(dateStr+'T12:00:00');
  return days[d.getDay()];
}
function fmtDateHeader(dateStr){
  const d=new Date(dateStr+'T12:00:00');
  const opts={weekday:'long', month:'long', day:'numeric'};
  return d.toLocaleDateString('en-US',opts);
}
function fmtShortDate(dateStr){
  const d=new Date(dateStr+'T12:00:00');
  return d.toLocaleDateString('en-US',{month:'short', day:'numeric'});
}
function addDays(dateStr,n){
  const d=new Date(dateStr+'T12:00:00'); d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function daysBetween(a,b){
  const da=new Date(a+'T00:00:00'), db=new Date(b+'T00:00:00');
  return Math.round((db-da)/86400000);
}

/* ---------- readiness ---------- */
function computeReadiness(sleep,sore,energy){
  const score = sleep+sore+energy;
  let state;
  if(score>=12) state='GREEN'; else if(score>=8) state='YELLOW'; else state='RED';
  if(sleep===1 || sore===1 || energy===1){ if(state==='GREEN') state='YELLOW'; }
  if(sore===1) state='RED';
  return {sleep,sore,energy,score,state};
}

/* ---------- streak / schedule ---------- */
function scheduleForDate(dateStr){
  const cfg = store.get('config');
  if(!cfg || !cfg.schedule) return null;
  return cfg.schedule[dowKey(dateStr)] || null;
}
/* A/B sequencing walks sessions by DATE, never by insertion order — manual
   entry can backfill out of order, and array position stopped meaning
   chronology the moment editing existed. `before` scopes the lookup so a
   backfilled session gets the letter its own date implies. */
function lastStrengthLetter(before){
  const sessions = (store.get('sessions') || []).slice()
    .filter(s=>(s.slot==='A'||s.slot==='B') && (!before || s.date < before))
    .sort((a,b)=> a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
  return sessions.length ? sessions[sessions.length-1].slot : null;
}
function nextStrengthLetter(before){
  const last = lastStrengthLetter(before);
  if(last==='A') return 'B';
  return 'A'; // null or B -> A
}
/* Scheduled sessions across the trailing 28 days, computed from config.schedule.
   [A hardcoded denominator misreports a partial history or a changed schedule,
   and manual entry plus delete both move the numerator.]
   Today enters the denominator only once it has been logged. [An unlogged
   training day is not a missed one until it is over; counting it early made
   consistency read low all day and snap up at night, which is a display that
   punishes you for the hours before your session.] */
function scheduledCountLast28(){
  const cfg = store.get('config');
  if(!cfg || !cfg.schedule) return 0;
  const meta = store.get('meta') || {};
  const start = meta.startDate || todayStr();
  const today = todayStr();
  const loggedToday = (store.get('sessions') || [])
    .some(s => s.date === today && s.slot !== 'SKIP');
  let n = 0;
  for(let i=0;i<28;i++){
    const d = addDays(today, -i);
    if(d < start) continue;                      // don't count days before the system existed
    if(d === today && !loggedToday) continue;    // today isn't a miss until it's over
    const slot = cfg.schedule[dowKey(d)];
    if(slot && slot!=='REST') n++;
  }
  return n;
}
/* Consecutive *scheduled* days completed. REST days are stepped over: they
   neither break the streak nor add to it. [system-design §1 prescribes Saturday
   rest, so a streak a rest day can break is measuring the wrong thing — it read
   0 every Saturday and again every Sunday until logging, on the Home screen, on
   an adherence-first system. A skipped scheduled day still ends it.]
   Days before meta.startDate stop the walk; there is no history back there. */
function currentStreak(){
  const cfg = store.get('config');
  const sessions = store.get('sessions') || [];
  const meta = store.get('meta') || {};
  const start = meta.startDate || todayStr();
  const byDate = {};
  sessions.forEach(s=>{ if(s.slot!=='SKIP') byDate[s.date]=true; });
  const isRest = d => {
    if(!cfg || !cfg.schedule) return false;
    const slot = cfg.schedule[dowKey(d)];
    return !slot || slot==='REST';
  };
  let streak=0, d=todayStr();
  // if today not logged yet, start checking from yesterday
  if(!byDate[d]) d = addDays(d,-1);
  while(d >= start){
    if(isRest(d)){ d = addDays(d,-1); continue; }  // rest days are stepped over
    if(!byDate[d]) break;                          // a missed scheduled day ends it
    streak++; d = addDays(d,-1);
  }
  return streak;
}
function weekSessionsCount(){
  const sessions = store.get('sessions') || [];
  const now = new Date(todayStr()+'T12:00:00');
  const dow = now.getDay(); // 0=sun
  const sunStr = addDays(todayStr(), -dow);
  let count=0;
  sessions.forEach(s=>{ if(s.date>=sunStr && s.date<=todayStr() && s.slot!=='SKIP') count++; });
  return {count, sunStr};
}
function sevenDayAvgBW(){
  const daily = (store.get('daily')||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  const last7 = daily.slice(-7);
  if(!last7.length) return null;
  const sum = last7.reduce((a,d)=>a+d.bw,0);
  return sum/last7.length;
}

/* ---------- exit guards ----------
   Polish, NOT the safety mechanism. Mobile Chrome suppresses beforeunload
   without prior interaction and behaves inconsistently in PWA standalone mode,
   so a guard that silently fails must still cost nothing — persistActive()
   already wrote every tap. Never make data safety depend on these firing. */
let guardPushed = false;
function pushSessionGuard(){
  if(guardPushed) return;
  try{ history.pushState({wosGuard:true}, ''); guardPushed = true; }catch(e){}
}
function clearSessionGuard(){ guardPushed = false; }

window.addEventListener('popstate', ()=>{
  if(!guardPushed) return;
  guardPushed = false;
  if(!store.get('active')){ return; }
  confirmSheet(
    'Leave session?',
    'Your logged sets are saved — you can pick this session back up from Home.',
    'LEAVE', 'STAY',
    ()=>{ Nav.home(); },
    ()=>{ pushSessionGuard(); }
  );
});

window.addEventListener('beforeunload', (e)=>{
  if(!store.get('active')) return;
  e.preventDefault();
  e.returnValue = '';
  return '';
});

function confirmSheet(title, body, okLabel, cancelLabel, onOk, onCancel){
  const backdrop = document.createElement('div');
  backdrop.className='modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal-sheet">
      <div class="card-title" style="font-size:20px;">${title}</div>
      <div class="microcopy mt8">${body}</div>
      <button class="pill-btn accent mt16" id="cs-ok">${okLabel}</button>
      <button class="pill-btn ghost mt12" id="cs-cancel">${cancelLabel}</button>
    </div>`;
  document.body.appendChild(backdrop);
  const close = ()=>{ if(backdrop.parentNode) document.body.removeChild(backdrop); };
  backdrop.querySelector('#cs-ok').onclick = ()=>{ close(); if(onOk) onOk(); };
  backdrop.querySelector('#cs-cancel').onclick = ()=>{ close(); if(onCancel) onCancel(); };
}

/* ---------- render root ---------- */
const Nav = {
  tab(name){
    if(name!=='home' && name!=='workouts') pendingQuick=null;  // a quick-start shortcut is abandoned if you browse elsewhere
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
    document.getElementById('tabbar').classList.remove('hidden');
    Screens.render(name);
  },
  toSession(variant, restored){
    document.getElementById('tabbar').classList.add('hidden');
    pushSessionGuard();
    Screens.render('session', {variant, restored});
  },
  toFinish(sessionDraft){
    document.getElementById('tabbar').classList.add('hidden');
    pushSessionGuard();
    Screens.render('finish', {draft:sessionDraft});
  },
  toManual(params){
    document.getElementById('tabbar').classList.add('hidden');
    Screens.render('manual', params||{});
  },
  toHistory(){
    document.getElementById('tabbar').classList.remove('hidden');
    Screens.render('history');
  },
  home(){
    clearSessionGuard();
    document.getElementById('tabbar').classList.remove('hidden');
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab==='home'));
    Screens.render('home');
  }
};

let lastRender = {name:'home', params:null};
const Screens = { render(name,params){
  if(typeof emomInterval!=='undefined' && emomInterval){ clearInterval(emomInterval); emomInterval=null; }
  lastRender = {name, params};
  const app=document.getElementById('app');
  app.innerHTML='';
  if(name==='home') app.innerHTML = renderHome();
  else if(name==='session') app.innerHTML = renderSession(params.variant, params.restored);
  else if(name==='finish') app.innerHTML = renderFinish(params.draft);
  else if(name==='progress') app.innerHTML = renderProgress();
  else if(name==='settings') app.innerHTML = renderSettings();
  else if(name==='manual') app.innerHTML = renderManual(params);
  else if(name==='history') app.innerHTML = renderHistory();
  else if(name==='workouts') app.innerHTML = renderWorkouts();
  else if(name==='workoutDetail') app.innerHTML = renderWorkoutDetail(params);
  else if(name==='notes') app.innerHTML = renderNotes();
  afterRender(name, params);
}};
// Re-render the current non-session screen (used after a link edit etc.)
function rerenderTab(){ if(['session','finish','manual'].indexOf(lastRender.name)>=0) return; Screens.render(lastRender.name, lastRender.params); }

/* ================= HOME ================= */
let readinessAns = {sleep:null, sore:null, energy:null};
let weeklyFields = {waist:'', steps:''};
let mvsMode = false; // set by the "No gym today" link on a strength day
let pendingQuick = null; // {kind:'CARDIO'} or {kind:'EMOM',emomId} — a "Log a walk" / library-Start shortcut; still runs through readiness

function renderHome(){
  ensureInit();
  mvsMode = false;
  // Reset readiness on every Home render. [Otherwise Start re-enables in the
  // previous session's state color carrying answers Joel never entered.]
  readinessAns = {sleep:null, sore:null, energy:null};
  const cfg = store.get('config');
  const meta = store.get('meta');
  const today = todayStr();
  const dow = dowKey(today);
  const isSat = dow==='sat';
  const isSun = dow==='sun';
  const streak = currentStreak();
  const wk = weekSessionsCount();
  const avg = sevenDayAvgBW();

  // Backup reminder banner removed at Joel's request (2026-08-15). Backup still
  // lives in Settings; the review feed depends on it, so this only drops the nudge.
  let backupBanner = '';

  // An unfinished session owns the screen: resume is the only sensible action,
  // and re-answering readiness on top of a live session would be nonsense.
  const active = store.get('active');
  if(active && active.date === today){
    return `
      <div class="screen active">
        ${backupBanner}
        <div class="flex-between"><h1 class="title">Home</h1></div>
        <div class="card accent-card">
          <div class="card-header"><div class="card-title">Session in progress</div></div>
          <div class="sub">${activeSummary(active)}</div>
        </div>
        <button class="pill-btn accent mt12" onclick="resumeActive()">RESUME SESSION</button>
        <button class="pill-btn ghost mt12" onclick="discardActive()">DISCARD</button>
        <div class="microcopy mt16 center">Everything you logged is saved.</div>
      </div>`;
  }

  let todayCardHtml;
  if(isSat){
    todayCardHtml = `
      <div class="card">
        <div class="card-header"><div class="card-title">Rest day</div></div>
        <div class="sub">Nothing scheduled. Back tomorrow.</div>
      </div>`;
  } else if(!cfg){
    todayCardHtml = `
      <div class="card">
        <div class="card-header"><div class="card-title">No program loaded</div></div>
        <div class="sub">Import a program from Settings to start logging sessions.</div>
      </div>`;
  } else {
    const slot = scheduleForDate(today);
    const isStrength = slot==='S';
    // v2.1: the plan's session is the Recommended pick; Joel can choose another.
    const rec = recommendedPick(today);
    const isEmomRec = rec && rec.kind==='EMOM';
    const label = isEmomRec ? 'Kettlebell EMOM' : (rec ? pickLabel(rec) : 'Cardio');
    const weekLine = isEmomRec ? `This week: ${escHtml(pickLabel(rec))}. ` : '';
    const noGymLink = isStrength
      ? `<div><a class="nogym-link" id="nogym-link" onclick="toggleNoGym(this)">No gym today</a></div>`
      : '';
    todayCardHtml = `
      <div class="card accent-card" id="today-card">
        <div class="card-header">
          <div class="card-title">${escHtml(label)}</div>
          ${rec ? `<span class="badge neutral">Recommended</span>` : ''}
        </div>
        <div class="sub">${weekLine}Answer readiness below to start.</div>
        <div><a class="nogym-link" id="pick-link" onclick="openPicker()">Pick a different workout</a></div>
        ${noGymLink}
      </div>`;
  }

  // Low prominence is deliberate — this must never compete with Start.
  const pastLink = cfg
    ? `<div class="center mt8"><a class="link" style="font-size:14px;" onclick="Nav.toManual({})">Log a past session</a></div>`
    : '';

  const bwSection = `
    <div class="card">
      <div class="card-title" style="font-size:17px;margin-bottom:10px;">Body weight</div>
      <div class="bw-row">
        <input type="number" inputmode="decimal" step="0.1" class="bw-input" id="bw-input" placeholder="lb">
        ${avg!==null ? `<span class="bw-avg">7-day avg: ${avg.toFixed(1)} lb</span>` : `<span class="bw-avg">7-day avg: —</span>`}
      </div>
    </div>`;

  const weeklyExtra = isSun ? `
    <div class="card">
      <div class="card-title" style="font-size:17px;margin-bottom:10px;">This week</div>
      <div class="bw-row mt8">
        <input type="number" inputmode="decimal" step="0.1" class="bw-input" id="waist-input" placeholder="waist in">
        <input type="number" inputmode="numeric" class="bw-input" id="steps-input" placeholder="avg steps">
      </div>
    </div>` : '';

  const readinessSection = isSat ? '' : `
    <div class="card">
      <div class="card-title" style="font-size:17px;">Readiness</div>
      ${readinessQ('sleep','Sleep last night')}
      ${readinessQ('sore','Soreness / joint feel')}
      ${readinessQ('energy','Energy and mood')}
    </div>
    <button class="pill-btn disabled" id="start-btn" onclick="startSession()">START</button>
  `;

  return `
    <div class="screen active">
      ${backupBanner}
      <div class="flex-between">
        <h1 class="title">Home</h1>
      </div>
      <div class="stat-row card" style="padding:16px 8px;">
        <div class="stat-block"><div class="stat-label">Streak</div><div class="stat-value">${streak}</div></div>
        <div class="stat-block"><div class="stat-label">This week</div><div class="stat-value">${wk.count}/6</div></div>
        <div class="stat-block"><div class="stat-label">Date</div><div class="stat-value" style="font-size:17px;">${fmtDateHeader(today).split(',')[0]}</div></div>
      </div>
      ${todayCardHtml}
      ${pendingQuick ? `<div class="banner" id="pick-banner">Today: ${escHtml(pendingQuick.kind==='CARDIO'?'Walk / cardio':pickLabel(pendingQuick))} — answer readiness, then Start. <span style="text-decoration:underline;cursor:pointer;" onclick="pendingQuick=null;Nav.home();">cancel</span></div>` : ''}

function quickWalk(){ pendingQuick = {kind:'CARDIO'}; Nav.home(); }
function quickEmom(emomId){ pendingQuick = {kind:'EMOM', emomId}; Nav.home(); }

/* ---- v2.1: choose today's workout ----
   The plan's session stays on the Today card as Recommended; Joel can pick any
   other. A pick only sets pendingQuick — readiness still runs next and still
   owns the outcome (RED → recovery, YELLOW → that type's rule). */
function hasEmom(cfg){ return !!(cfg && cfg.emom && cfg.emom.workouts && cfg.emom.workouts.length); }
// What the plan says for a date — the same mapping startSession has always used.
function recommendedPick(dateStr){
  const cfg = store.get('config');
  if(!cfg || !cfg.schedule) return null;
  const slot = cfg.schedule[dowKey(dateStr)];
  if(slot==='S') return {kind:'STRENGTH', letter: nextStrengthLetter()};
  if(slot==='K' && hasEmom(cfg)) return {kind:'EMOM', emomId: weekEmomId(dateStr)};
  if(slot==='C' || slot==='K') return {kind:'CARDIO'};
  return null;
}
// Works on picks and on session variants alike (same kind/letter/emomId/mvsType fields).
function samePick(a, b){
  if(!a || !b || a.kind!==b.kind) return false;
  if(a.kind==='STRENGTH') return a.letter===b.letter;
  if(a.kind==='EMOM') return a.emomId===b.emomId;
  if(a.kind==='MVS') return a.mvsType===b.mvsType;
  return true;
}
function pickLabel(p){
  if(!p) return '';
  if(p.kind==='STRENGTH') return 'Strength ' + p.letter;
  if(p.kind==='EMOM'){ const w = emomWorkout(p.emomId || weekEmomId(todayStr())); return w ? w.name : 'Kettlebell EMOM'; }
  if(p.kind==='CARDIO') return 'Cardio';
  if(p.kind==='MVS') return 'No gym — ' + ({gym:'Gym circuit', travel:'Travel / bodyweight', outdoor:'Outdoor walk'}[p.mvsType] || '');
  return '';
}
let pickItems = [];
function openPicker(){
  const cfg = store.get('config');
  if(!cfg) return;
  const today = todayStr();
  const rec = recommendedPick(today);
  const next = nextStrengthLetter();
  const wk = hasEmom(cfg) ? weekEmomId(today) : null;
  const items = [];
  ['A','B'].forEach(L=>{ if(cfg.workouts && cfg.workouts[L]) items.push({pick:{kind:'STRENGTH', letter:L}, group:'Strength', tag: L===next ? 'next up' : ''}); });
  if(hasEmom(cfg)){
    const ws = cfg.emom.workouts;
    ws.filter(w=>w.id===wk).concat(ws.filter(w=>w.id!==wk))
      .forEach(w=>items.push({pick:{kind:'EMOM', emomId:w.id}, group:'Kettlebell EMOM', tag: w.id===wk ? 'this week' : ''}));
  }
  items.push({pick:{kind:'CARDIO'}, group:'Cardio', tag:''});
  ['gym','travel','outdoor'].forEach(t=>items.push({pick:{kind:'MVS', mvsType:t}, group:'No gym', tag:''}));
  const ri = items.findIndex(it=>samePick(it.pick, rec));
  if(ri>=0){ const r = items.splice(ri,1)[0]; r.group = 'Recommended'; items.unshift(r); }
  pickItems = items;
  let lastGroup = null;
  const rows = items.map((it,i)=>{
    const head = it.group!==lastGroup ? `<div class="microcopy" style="margin:14px 0 4px;text-transform:uppercase;letter-spacing:.5px;">${it.group}</div>` : '';
    lastGroup = it.group;
    const chosen = pendingQuick ? samePick(pendingQuick.kind==='EMOM' && !pendingQuick.emomId ? {kind:'EMOM', emomId:wk} : pendingQuick, it.pick) : (i===0 && ri>=0);
    const tag = it.tag ? `<span class="badge neutral">${it.tag}</span>` : '';
    return `${head}<div class="list-row pick-row" data-pick="${i}" style="cursor:pointer;" onclick="choosePick(${i})">
      <div style="flex:1;min-width:0;"><div class="list-title">${escHtml(pickLabel(it.pick))}</div></div>${tag}${chosen?'<span style="color:var(--accent);font-weight:800;margin-left:8px;">✓</span>':''}</div>`;
  }).join('');
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'pick-sheet';
  backdrop.innerHTML = `
    <div class="modal-sheet" style="max-height:85vh;overflow-y:auto;">
      <div class="card-title" style="font-size:20px;">Pick today's workout</div>
      <div class="microcopy mt8">Readiness still comes first. RED is always recovery.</div>
      ${rows}
      <button class="pill-btn ghost mt16" id="pick-close">CLOSE</button>
    </div>`;
  document.body.appendChild(backdrop);
  const close = ()=>{ if(backdrop.parentNode) document.body.removeChild(backdrop); };
  backdrop.querySelector('#pick-close').onclick = close;
  backdrop.addEventListener('click', e=>{ if(e.target===backdrop) close(); });
}
function choosePick(i){
  const it = pickItems[i];
  const sheet = document.getElementById('pick-sheet');
  if(sheet && sheet.parentNode) sheet.parentNode.removeChild(sheet);
  if(!it) return;
  // Picking the Recommended one is just the plan — no pending pick needed.
  pendingQuick = samePick(it.pick, recommendedPick(todayStr())) ? null : Object.assign({}, it.pick);
  Nav.home();
}

function activeSummary(a){
  const v = a.variant || {};
  let what = 'Session';
  if(v.kind==='STRENGTH') what = 'Strength ' + (v.letter||'');
  else if(v.kind==='CARDIO') what = 'Cardio';
  else if(v.kind==='REC') what = 'Recovery';
  else if(v.kind==='MVS') what = 'MVS — ' + (v.mvsType||'');
  else if(v.kind==='MVS_PICK') what = 'MVS — pick a tier';
  let logged = 0;
  (a.exercises||[]).forEach(r=>(r.sets||[]).forEach(s=>{ if(s) logged++; }));
  (a.mvsItems||[]).forEach(it=>(it.logged||[]).forEach(x=>{ if(x) logged++; }));
  const bits = [what];
  if(logged) bits.push(logged + ' set' + (logged===1?'':'s') + ' logged');
  if(a.screen==='finish') bits.push('at the finish screen');
  return bits.join(' · ');
}

function resumeActive(){
  const a = store.get('active');
  if(!a){ Nav.home(); return; }
  cardioTimer.restore(a.timers && a.timers.cardio);
  recTimer.restore(a.timers && a.timers.rec);
  outdoorTimer.restore(a.timers && a.timers.outdoor);
  finisherTimer.restore(a.timers && a.timers.finisher);
  if(a.screen==='finish' && a.finishDraft){
    sessionState = restoreSessionState(a);
    selectedRPE = a.rpe!=null ? a.rpe : null;
    Nav.toFinish(a.finishDraft);
    return;
  }
  Nav.toSession(a.variant, a);
}

function restoreSessionState(a){
  return {
    variant: a.variant, work: [], startedAt: a.startedAt,
    restEndAt: a.restEndAt, mode: a.mode, min: a.min, note: a.note||'',
    vest: (a.vest!=null ? a.vest : null),
    finisherMode: a.finisherMode||null,
    finisherMin: (a.finisherMin!=null ? a.finisherMin : null),
    finisherVest: (a.finisherVest!=null ? a.finisherVest : null),
    frozen: !!a.frozen,
    exercises: a.exercises||null, mvsItems: a.mvsItems||null,
    recChecks: a.recChecks||null, warmChecks: a.warmChecks||null, steps: a.steps||null, emom: a.emom||null, date: a.date, manual: !!a.manual,
    editingIndex: (a.editingIndex!=null ? a.editingIndex : null),
    finishDraft: a.finishDraft||null, screen: a.screen||'session'
  };
}

function discardActive(){
  confirmSheet('Discard this session?',
    'Everything logged in it will be thrown away. This cannot be undone.',
    'DISCARD', 'KEEP IT',
    ()=>{ clearActive(); sessionState=null; Nav.home(); });
}

/* An unfinished session from a previous day. Never dropped silently — an
   abandoned session is data, and discarding it unasked is the app deciding
   something on Joel's behalf. */
function checkStaleActive(){
  const a = store.get('active');
  if(!a || a.date === todayStr()) return false;
  confirmSheet(
    'Unfinished session from ' + a.date,
    activeSummary(a) + '. Log it as it stands, or throw it away?',
    'FINISH & LOG IT', 'DISCARD',
    ()=>{
      cardioTimer.restore(a.timers && a.timers.cardio);
      recTimer.restore(a.timers && a.timers.rec);
      outdoorTimer.restore(a.timers && a.timers.outdoor);
      finisherTimer.restore(a.timers && a.timers.finisher);
      sessionState = restoreSessionState(a);
      const draft = a.finishDraft || buildDraftFromActive(a);
      selectedRPE = a.rpe!=null ? a.rpe : null;
      Nav.toFinish(draft);
    },
    ()=>{ clearActive(); sessionState=null; Nav.home(); }
  );
  return true;
}

function buildDraftFromActive(a){
  const v = a.variant||{};
  const base = { date:a.date, readiness:v.readiness||null, startedAt:a.startedAt };
  if(v.kind==='STRENGTH'){
    base.slot = v.letter;
    base.work = (a.exercises||[]).map(row=>({
      ex: row.ex.id,
      target: `${row.ex.sets||3}x${row.ex.repLo}-${row.ex.repHi}@${row.weight||row.ex.startWeight||0}`,
      sets: (row.sets||[]).filter(Boolean).map(s=>[s.weight,s.reps])
    }));
    const fm = a.finisherMin!=null ? a.finisherMin : 0;
    if(fm>0){
      base.finisher = { mode: a.finisherMode||'incline_walk', min: fm };
      if(base.finisher.mode==='incline_walk' && a.finisherVest>0) base.finisher.vest = a.finisherVest;
    }
  } else if(v.kind==='CARDIO'){
    base.slot = 'C';
    const cw = {mode: a.mode||'incline_walk', min: cardioTimer.minutes()||20};
    if(a.vest!=null && a.vest>0) cw.vest = a.vest;
    base.work = [cw];
  } else if(v.kind==='MVS' && v.mvsType==='outdoor'){
    base.slot='MVS'; base.mvsType='outdoor'; base.min = outdoorTimer.minutes()||20;
  } else if(v.kind==='MVS'){
    base.slot='MVS'; base.mvsType=v.mvsType;
    base.work = (a.mvsItems||[]).map(it=>({ex:it.id, target:it.target}));
  } else {
    base.slot='REC';
    base.work = [{mode:'recovery', min: recTimer.minutes()||20}];
  }
  return base;
}

function readinessQ(key,label){
  let dots='';
  if(key==='sore'){
    /* Soreness reads as an AMOUNT of soreness: 5 (very sore) … 1 (fresh), with
       1 on the right so "good" sits on the right like the other rows (Joel,
       2026-07-31). Display-only flip: the STORED value is 6 − displayed, so
       stored semantics (1 = very sore, 5 = fresh), the score math, the
       sore-forces-RED override, and every §4 rule read old and new records
       identically. data-val carries the stored value. */
    for(let d=5; d>=1; d--){
      dots += `<button class="dot" data-key="sore" data-val="${6-d}" onclick="setReadiness('sore',${6-d})">${d}</button>`;
    }
  } else {
    for(let i=1;i<=5;i++){
      dots += `<button class="dot" data-key="${key}" data-val="${i}" onclick="setReadiness('${key}',${i})">${i}</button>`;
    }
  }
  const hint = key==='sore' ? `<div class="microcopy" style="margin-top:6px;">5 = very sore · 1 = fresh</div>` : '';
  return `<div class="readiness-q"><div class="readiness-label">${label}</div><div class="dots">${dots}</div>${hint}</div>`;
}

function setReadiness(key,val){
  readinessAns[key]=val;
  document.querySelectorAll(`.dot[data-key="${key}"]`).forEach(d=>{
    d.classList.toggle('selected', parseInt(d.dataset.val)===val);
  });
  updateStartBtn();
}

function updateStartBtn(){
  const btn = document.getElementById('start-btn');
  if(!btn) return;
  const {sleep,sore,energy} = readinessAns;
  if(sleep && sore && energy){
    const r = computeReadiness(sleep,sore,energy);
    btn.classList.remove('disabled');
    btn.classList.remove('green','yellow','red');
    btn.classList.add(r.state.toLowerCase());
    btn.textContent = r.state + ' — START';
  } else {
    btn.classList.add('disabled');
    btn.classList.remove('green','yellow','red');
    btn.textContent = 'START';
  }
}

function toggleNoGym(el){
  mvsMode = !mvsMode;
  el.textContent = mvsMode ? '✓ No-gym mode — pick MVS after START' : 'No gym today';
  const card = document.getElementById('today-card');
  if(card) card.style.outline = mvsMode ? '2px solid #fff' : 'none';
}

function startSession(){
  const {sleep,sore,energy} = readinessAns;
  if(!sleep||!sore||!energy) return;
  const r = computeReadiness(sleep,sore,energy);
  const today = todayStr();
  const cfg = store.get('config');
  const dow = dowKey(today);
  const slotType = cfg ? cfg.schedule[dow] : null;

  // No-gym mode routes to the MVS picker — but a RED reading still owns the
  // session (hard rule §4: RED = recovery, never a strength circuit).
  // v2.1: anything other than the Recommended session is flagged offPlan.
  const rec = recommendedPick(today);

  if(mvsMode && !pendingQuick && r.state!=='RED'){
    window._weeklyFieldsPending = weeklyFields;
    saveWeeklyIfSunday();
    saveBWIfEntered();
    Nav.toSession({kind:'MVS_PICK', readiness:r, offPlan: !!rec});   // MVS is never the Recommended pick
    return;
  }

  // A pick (the picker, "Log a walk", a library Start) overrides the scheduled
  // slot — but readiness still gates it (RED always routes to recovery, hard rule §4).
  const quick = pendingQuick; pendingQuick = null;
  const degraded = r.state==='YELLOW';

  let variant = null;
  if(r.state==='RED'){
    variant = {kind:'REC', readiness:r};
  } else if(quick){
    if(quick.kind==='CARDIO') variant = {kind:'CARDIO', degraded, readiness:r};
    else if(quick.kind==='EMOM' && hasEmom(cfg)) variant = {kind:'EMOM', emomId: quick.emomId || weekEmomId(today), degraded, readiness:r};
    else if(quick.kind==='STRENGTH') variant = {kind:'STRENGTH', letter: quick.letter, degraded, readiness:r};
    else if(quick.kind==='MVS') variant = {kind:'MVS', mvsType: quick.mvsType, readiness:r};
  }
  if(!variant){
    if(slotType==='S'){
      const letter = nextStrengthLetter();
      variant = {kind:'STRENGTH', letter, degraded, readiness:r};
    } else if(slotType==='K' && hasEmom(cfg)){
      variant = {kind:'EMOM', emomId: weekEmomId(today), degraded, readiness:r};
    } else if(slotType==='C' || slotType==='K'){
      variant = {kind:'CARDIO', degraded, readiness:r};
    } else {
      variant = {kind:'REC', readiness:r};
    }
  }
  // RED recovery is the rule, not a choice, so it is never offPlan.
  if(variant.kind!=='REC' && rec && !samePick(variant, rec)) variant.offPlan = true;
  window._weeklyFieldsPending = weeklyFields;
  saveWeeklyIfSunday();
  saveBWIfEntered();
  Nav.toSession(variant);
}

function saveBWIfEntered(){
  const el = document.getElementById('bw-input');
  if(el && el.value){
    const daily = store.get('daily')||[];
    const today = todayStr();
    const existing = daily.find(d=>d.date===today);
    if(existing) existing.bw = parseFloat(el.value);
    else daily.push({date:today, bw:parseFloat(el.value)});
    store.set('daily', daily);
  }
}
function saveWeeklyIfSunday(){
  if(dowKey(todayStr())!=='sun') return;
  const w = document.getElementById('waist-input');
  const s = document.getElementById('steps-input');
  if(w && w.value){
    const weekly = store.get('weekly')||[];
    weekly.push({weekOf: todayStr(), waist: parseFloat(w.value), steps: s&&s.value?parseInt(s.value):null});
    store.set('weekly', weekly);
  }
}

/* ================= SESSION ================= */
let sessionState = null; // working state during a session

function renderSession(variant, restored){
  if(restored){
    sessionState = restoreSessionState(restored);
    sessionState.restored = true;
    restEndAt = restored.restEndAt || null;
    if(restEndAt!=null && restEndAt > Date.now()){
      clearInterval(restTimerInterval);
      restTimerInterval = setInterval(renderRestTimer, 250);
    } else { restEndAt = null; }
  } else {
    sessionState = { variant, work: [], startedAt: Date.now(), restEndAt:null,
                     // seed from the record being edited so an edit preserves
                     // what was logged rather than silently resetting it
                     mode: (variant && variant.existing && (variant.existing.work||[])[0])
                           ? (variant.existing.work[0].mode || null) : null,
                     min: (variant && variant.existing) ? (variant.existing.min!=null ? variant.existing.min : null) : null,
                     vest: (variant && variant.existing && (variant.existing.work||[])[0] && variant.existing.work[0].vest!=null)
                           ? variant.existing.work[0].vest : null,
                     finisherMode: (variant && variant.existing && variant.existing.finisher)
                           ? (variant.existing.finisher.mode||null) : null,
                     finisherMin: (variant && variant.existing && variant.existing.finisher && variant.existing.finisher.min!=null)
                           ? variant.existing.finisher.min : null,
                     finisherVest: (variant && variant.existing && variant.existing.finisher && variant.existing.finisher.vest!=null)
                           ? variant.existing.finisher.vest : null,
                     note: (variant && variant.existing) ? (variant.existing.note||'') : '',
                     date: (variant && variant.date) || todayStr(),
                     manual: !!(variant && variant.manual),
                     editingIndex: (variant && variant.editingIndex!=null) ? variant.editingIndex : null };
  }

  let html;
  if(variant.kind==='MVS_PICK')      html = renderMvsPicker(variant);
  else if(variant.kind==='MVS')      html = renderMvsSession(variant);
  else if(variant.kind==='REC')      html = renderRecSession();
  else if(variant.kind==='CARDIO')   html = renderCardioSession(variant);
  else if(variant.kind==='EMOM')     html = renderEmomSession(variant);
  else                               html = renderStrengthSession(variant);

  persistActive('session');
  return html;
}

/* Pre-fill reps for an unlogged set: last session's reps for that set index
   (falling back to the last set's number when this session has more sets),
   unless the row was built post-advance — then it's back to repLo (§5 reset). */
function prefillRepsFor(row, s){
  const ex = row.ex;
  const arr = row.prefillReps;
  if(arr && arr.length) return (arr[s]!=null ? arr[s] : arr[arr.length-1]);
  return ex.repHi==null ? (ex.durationSec||0) : (ex.repLo||8);
}
/* Per-set weight carry: a mid-exercise weight drop (row 80 → 60 on 07-31) must
   pre-fill per set, not smear the first set's weight across all of them. */
function prefillWeightFor(row, s){
  const arr = row.prefillWeights;
  if(arr && arr.length) return (arr[s]!=null ? arr[s] : arr[arr.length-1]);
  return row.weight || (row.ex.startWeight||0);
}

function renderStrengthSession(variant){
  const cfg = store.get('config');
  const list = (cfg && cfg.workouts && cfg.workouts[variant.letter]) || [];
  const lifts = store.get('lifts') || {};
  if(!(sessionState && sessionState.restored)) finisherTimer.reset();
  // Only build fresh exercise rows if we aren't resuming — a restored session
  // already carries its logged sets and must not be reset to empty.
  if(!sessionState.exercises){
    // Editing a saved session pre-fills its recorded sets — otherwise "edit"
    // would mean re-entering the whole workout from scratch.
    const prior = {};
    if(variant.existing){
      (variant.existing.work||[]).forEach(w=>{ prior[w.ex] = w.sets||[]; });
    }
    /* Auto-carry + rules-compliant targets (v1.6.0):
       - lift never performed → startWeight @ repLo (calibration).
       - advanced last session AND today may progress → bumped weight, reps reset
         to repLo (double progression, §5).
       - otherwise → last session's actual weight and actual reps, verbatim.
       Progression is gated by §4: YELLOW = no bump; soreness freeze = no bump.
       The gate lives here, at render, because the bump itself is baked into the
       lifts cache — through v1.5.3 YELLOW sessions showed the bumped weight,
       which was a live rule violation. */
    const frozen = sorenessFreezeActive(sessionState.date || todayStr());
    sessionState.frozen = frozen;
    const allowBump = !variant.degraded && !frozen;
    sessionState.exercises = list.map(ex=>{
      const st = lifts[ex.id] || {weight:null, lastWeight:null, lastReps:[], advanced:false};
      const saved = prior[ex.id];
      if(saved){
        return { ex, weight: saved.length ? saved[0][0] : (st.lastWeight!=null?st.lastWeight:st.weight),
                 prefillReps: null,
                 sets: saved.map(s=>({weight:s[0], reps:s[1]})) };
      }
      if(st.lastWeight==null){
        return {ex, weight: (st.weight!=null ? st.weight : (ex.startWeight||0)), prefillReps: null, prefillWeights: null, sets: []};
      }
      if(st.advanced && allowBump){
        return {ex, weight: st.weight, prefillReps: null, prefillWeights: null, sets: []};
      }
      return {ex, weight: st.lastWeight,
              prefillReps: (st.lastReps||[]).slice(),
              prefillWeights: (st.lastSets||[]).map(x=>x[0]),
              sets: []};
    });
  }

  const stripe = variant.degraded ? `<span class="badge yellow">YELLOW — modified</span>` : `<span class="badge green">GREEN</span>`;
  const frozenNote = sessionState.frozen
    ? `<div class="banner">Soreness rule active — all loads frozen this week. Numbers repeat last session.</div>` : '';

  let exHtml = sessionState.exercises.map((row,idx)=>{
    const ex = row.ex;
    let numSets = ex.sets || 3;
    if(variant.degraded) numSets = Math.max(1, numSets-1);
    const weight = row.weight || ex.startWeight || 0;
    const repRange = ex.repHi==null ? `${ex.durationSec||0}s` : `${ex.repLo}–${ex.repHi}`;
    let setsHtml='';
    for(let s=0;s<numSets;s++){
      const done = (row.sets||[])[s];
      const wShown = done ? done.weight : prefillWeightFor(row, s);
      const rShown = done ? done.reps : prefillRepsFor(row, s);
      setsHtml += `
        <div class="set-row" data-ex="${idx}" data-set="${s}">
          <button class="tap-circle${done?' logged':''}" id="circ-${idx}-${s}" onclick="logSet(${idx},${s})">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
          </button>
          <span class="set-num">${s+1}</span>
          <span class="spacer"></span>
          <button class="chip" id="wchip-${idx}-${s}" onclick="editSet(${idx},${s},'weight')">${wShown}</button>
          <span class="unit">LBS</span>
          <button class="chip" id="rchip-${idx}-${s}" onclick="editSet(${idx},${s},'reps')">${rShown}</button>
          <span class="unit">${ex.repHi==null?'Secs':'Reps'}</span>
        </div>`;
    }
    const durTimer = (ex.repHi==null && ex.durationSec) ? `
        <div style="display:flex;align-items:center;gap:10px;margin-top:8px;">
          <div id="exdur-${idx}" style="font-size:24px;font-weight:800;min-width:70px;">0:${pad(ex.durationSec)}</div>
          <button class="pill-btn accent small" style="width:auto;padding:8px 14px;margin:0;" onclick="exDurStart(${idx},${ex.durationSec})">START</button>
          <button class="pill-btn ghost small" style="width:auto;padding:8px 14px;margin:0;" onclick="exDurReset(${idx},${ex.durationSec})">RESET</button>
        </div>` : '';
    return `
      <div class="card ex-card">
        <div class="card-header">
          <div class="card-title" style="cursor:pointer;flex:1;min-width:0;" onclick="openLiftHistory('${ex.id}')">${ex.name}</div>
          <button style="${exBtnStyle()}" onclick="openLiftHistory('${ex.id}')" title="History"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>
          ${exLinkBtns(ex.id)}
        </div>
        <div class="ex-cue">${ex.cue||''}</div>
        <div class="ex-target">${numSets} × ${repRange} @ ${weight} lb</div>
        ${durTimer}
        ${setsHtml}
      </div>`;
  }).join('');

  // v2.0: warmup rendered and tracked as the first block of the session, and
  // per-session step capture (start at top, end just above Finish).
  const warmList = (cfg && cfg.warmup) || [];
  if(!sessionState.warmChecks) sessionState.warmChecks = warmList.map(()=>false);
  if(!sessionState.steps) sessionState.steps = {start:'', end:''};
  const stepInStyle = 'width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;color:#fff;padding:12px 14px;font-size:16px;font-family:inherit;';
  const warmHtml = warmList.length ? `
      <div class="card">
        <div class="card-header"><div class="card-title" style="font-size:18px;">Warmup</div></div>
        ${warmList.map((m,i)=>`
          <div class="warm-row" style="display:flex;align-items:center;padding:10px 0;cursor:pointer;" onclick="toggleWarmCheck(${i}, this)">
            <span class="tap-circle${sessionState.warmChecks[i]?' logged':''}"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></span>
            <span style="font-weight:600;margin-left:10px;">${m}</span>
          </div>`).join('')}
      </div>` : '';
  const stepsStartHtml = `
      <div class="card">
        <div class="card-title" style="font-size:16px;margin-bottom:8px;">Start steps</div>
        <input inputmode="numeric" placeholder="your step count now" value="${sessionState.steps.start||''}" oninput="setStepField('start', this.value)" style="${stepInStyle}">
      </div>`;
  const stepsEndHtml = `
      <div class="card">
        <div class="card-title" style="font-size:16px;margin-bottom:8px;">End steps</div>
        <input inputmode="numeric" placeholder="your step count now" value="${sessionState.steps.end||''}" oninput="setStepField('end', this.value)" style="${stepInStyle}">
        <div class="microcopy" id="steps-diff" style="margin-top:8px;">${stepsDiffText()}</div>
      </div>`;
  return `
    <div class="screen active" style="padding-bottom:100px;">
      <div class="flex-between mt8" style="margin-bottom:12px;">
        <h1 class="title" style="margin-bottom:0;">Session</h1>
        ${stripe}
      </div>
      ${frozenNote}
      <div id="rest-timer-wrap"></div>
      ${warmHtml}
      ${stepsStartHtml}
      ${exHtml}
      ${finisherCard()}
      ${stepsEndHtml}
    </div>
    <div class="sticky-bar"><div class="sticky-bar-inner">
      <button class="pill-btn accent" onclick="finishStrengthSession()">FINISH SESSION</button>
    </div></div>
  `;
}

/* v2.0 warmup + steps helpers */
function toggleWarmCheck(i, rowEl){
  if(!sessionState || !sessionState.warmChecks) return;
  sessionState.warmChecks[i] = !sessionState.warmChecks[i];
  const c = rowEl.querySelector('.tap-circle');
  if(c) c.classList.toggle('logged', sessionState.warmChecks[i]);
  persistActive('session');
}
function stepsDiffText(){
  const s = sessionState && sessionState.steps; if(!s) return '';
  const a = parseInt(s.start,10), b = parseInt(s.end,10);
  if(!isNaN(a) && !isNaN(b) && b>=a) return (b-a).toLocaleString()+' steps during this workout';
  return 'Enter start now, end when you finish.';
}
function setStepField(which, val){
  if(!sessionState) return;
  if(!sessionState.steps) sessionState.steps = {start:'', end:''};
  sessionState.steps[which] = val;
  const d = document.getElementById('steps-diff'); if(d) d.textContent = stepsDiffText();
  persistActive('session');
}
/* Shared steps card (cardio + EMOM): start and end in one card. Strength keeps
   its split layout (start at top, end above Finish). */
function stepsCard(){
  if(sessionState && !sessionState.steps) sessionState.steps = {start:'', end:''};
  const s = (sessionState && sessionState.steps) || {start:'', end:''};
  const st = 'width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;color:#fff;padding:12px 14px;font-size:16px;font-family:inherit;';
  return `
    <div class="card">
      <div class="card-title" style="font-size:17px;margin-bottom:8px;">Steps</div>
      <div style="display:flex;gap:9px;">
        <div style="flex:1;"><div class="microcopy" style="margin-bottom:5px;">Start</div><input inputmode="numeric" value="${s.start||''}" oninput="setStepField('start', this.value)" style="${st}"></div>
        <div style="flex:1;"><div class="microcopy" style="margin-bottom:5px;">End</div><input inputmode="numeric" value="${s.end||''}" oninput="setStepField('end', this.value)" style="${st}"></div>
      </div>
      <div class="microcopy mt8" id="steps-diff">${stepsDiffText()}</div>
    </div>`;
}
function stepsDraft(){
  if(!sessionState || !sessionState.steps) return null;
  const a=parseInt(sessionState.steps.start,10), b=parseInt(sessionState.steps.end,10);
  return (!isNaN(a) && !isNaN(b)) ? {start:a, end:b} : null;
}

/* Finisher (system-design §1): every strength session ends with 8–12 min of
   incline walk or carries. Always rendered, on YELLOW too (Joel's call,
   2026-07-31 — it's easy walking, not load). Mode is a picker; last-used wins
   next time. Typed minutes beat the timer, same rule as every timed screen. */
/* v2.1: the same card is the EMOM's optional walk block ({emom:true}) — no
   mode picker, mode is always 'walk'. The vest shows for walking only. */
function finisherCard(opts){
  const emom = !!(opts && opts.emom);
  const prefs = store.get('prefs')||{};
  if(emom) sessionState.finisherMode = 'walk';
  else if(!sessionState.finisherMode) sessionState.finisherMode = prefs.finisherMode || 'incline_walk';
  const m = sessionState.finisherMode;
  const v = sessionState.finisherMin!=null ? sessionState.finisherMin : '';
  const showVest = emom || m==='incline_walk';
  const head = emom ? `
      <div class="card-header">
        <div class="card-title" style="font-size:17px;">Walk</div>
        <span class="badge neutral">optional</span>
      </div>
      <div class="microcopy" style="margin-bottom:10px;">Easy walk after the EMOM. Leave it at zero to skip.</div>` : `
      <div class="card-header">
        <div class="card-title" style="font-size:17px;">Finisher</div>
        <span class="badge neutral">8–12 min</span>
      </div>
      <div class="microcopy" style="margin-bottom:10px;">Part of the session — easy effort.</div>
      <div style="display:flex; gap:8px; margin-bottom:12px;">
        <button class="chip" id="fin-mode-walk" onclick="setFinisherMode('incline_walk')" style="${m==='incline_walk'?'background:var(--accent);color:#fff;':''}">Incline walk</button>
        <button class="chip" id="fin-mode-carry" onclick="setFinisherMode('carry')" style="${m==='carry'?'background:var(--accent);color:#fff;':''}">Carries</button>
      </div>`;
  return `
    <div class="card" id="finisher-card">
      ${head}
      <div class="center">
        <div class="timer-pill" id="finisher-timer">00:00</div>
        <div class="mt12"><button class="pill-btn accent small" id="finisher-toggle" onclick="toggleFinisherTimer()">START</button></div>
      </div>
      <div class="bw-row mt12">
        <input type="number" inputmode="numeric" id="finisher-min" class="bw-input" placeholder="min" value="${v}" oninput="setFinisherMin(this.value)">
        <span class="bw-avg">or type the minutes</span>
      </div>
      <div id="fin-vest" class="mt16" style="display:${showVest?'block':'none'};">${vestFields('finisherVest')}</div>
    </div>`;
}
function setFinisherMode(m){
  if(!sessionState) return;
  sessionState.finisherMode = m;
  const prefs = store.get('prefs')||{};
  prefs.finisherMode = m;
  store.set('prefs', prefs);
  const w = document.getElementById('fin-mode-walk'), c = document.getElementById('fin-mode-carry');
  if(w) w.style.cssText = m==='incline_walk' ? 'background:var(--accent);color:#fff;' : '';
  if(c) c.style.cssText = m==='carry' ? 'background:var(--accent);color:#fff;' : '';
  const fv = document.getElementById('fin-vest');
  if(fv) fv.style.display = m==='incline_walk' ? 'block' : 'none';
  persistActive('session');
}
function toggleFinisherTimer(){ finisherTimer.toggle(); persistActive('session'); }
function setFinisherMin(v){
  if(!sessionState) return;
  const n = parseInt(v);
  sessionState.finisherMin = (v==='' || isNaN(n)) ? null : n;
  persistActive('session');
}

/* Exercise history — tap a lift's name on the Session screen. Read-only. */
function openLiftHistory(exId){
  const cfg = store.get('config');
  const def = findExDef(cfg, exId);
  const unit = def && def.repHi==null ? 's' : '';
  const rows = (store.get('sessions')||[])
    .filter(s=>s.slot==='A'||s.slot==='B')
    .slice()
    .sort((a,b)=> a.date < b.date ? 1 : (a.date > b.date ? -1 : 0))
    .map(s=>{
      const w = (s.work||[]).find(x=>x.ex===exId);
      if(!w || !w.sets || !w.sets.length) return null;
      const sets = w.sets.map(x=>`${x[0]}×${x[1]}${unit}`).join('  ');
      return `<div class="list-row"><div class="list-title" style="font-size:15px;">${fmtShortDate(s.date)}</div><div class="list-trailing">${sets}</div></div>`;
    })
    .filter(Boolean)
    .slice(0,12)
    .join('');
  const backdrop = document.createElement('div');
  backdrop.className='modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal-sheet">
      <div class="card-title" style="font-size:20px;">${def?def.name:exId}</div>
      <div class="microcopy mt8">weight × reps per set, newest first</div>
      <div class="mt12">${rows || '<div class="microcopy">No history yet.</div>'}</div>
      <button class="pill-btn ghost mt16" id="lh-close">CLOSE</button>
    </div>`;
  document.body.appendChild(backdrop);
  backdrop.querySelector('#lh-close').onclick = ()=>{ document.body.removeChild(backdrop); };
}

function logSet(exIdx, setIdx){
  const row = sessionState.exercises[exIdx];
  const circ = document.getElementById(`circ-${exIdx}-${setIdx}`);
  const wchip = document.getElementById(`wchip-${exIdx}-${setIdx}`);
  const rchip = document.getElementById(`rchip-${exIdx}-${setIdx}`);
  circ.classList.add('logged');
  // Log at whatever the chips show — the pre-fill, or a number already edited.
  const w = parseFloat(wchip.textContent); const r = parseFloat(rchip.textContent);
  const weight = isNaN(w) ? (row.weight||0) : w;
  const reps = isNaN(r) ? prefillRepsFor(row, setIdx) : r;
  row.sets[setIdx] = {weight, reps};
  const restSec = row.ex.restSec || 90;
  startRestTimer(restSec);
  persistActive('session');
}

function editSet(exIdx, setIdx, field){
  const row = sessionState.exercises[exIdx];
  const current = (row.sets[setIdx]) || {
    weight: parseFloat(document.getElementById(`wchip-${exIdx}-${setIdx}`).textContent)||row.weight||0,
    reps: parseFloat(document.getElementById(`rchip-${exIdx}-${setIdx}`).textContent)||prefillRepsFor(row,setIdx)
  };
  const isDur = row.ex.repHi==null;
  const label = field==='weight' ? 'Weight (lb)' : (isDur ? 'Seconds' : 'Reps');
  openNumpad(field==='weight'?current.weight:current.reps, (val)=>{
    if(field==='weight'){
      document.getElementById(`wchip-${exIdx}-${setIdx}`).textContent = val;
    } else {
      document.getElementById(`rchip-${exIdx}-${setIdx}`).textContent = val;
      document.getElementById(`circ-${exIdx}-${setIdx}`).classList.add('logged');
    }
    const w = parseFloat(document.getElementById(`wchip-${exIdx}-${setIdx}`).textContent)||0;
    const r = parseFloat(document.getElementById(`rchip-${exIdx}-${setIdx}`).textContent)||0;
    row.sets[setIdx] = {weight:w, reps:r};
    persistActive('session');
    // v2.1 (session note 8/17): weight is always followed by reps — go straight on.
    if(field==='weight') editSet(exIdx, setIdx, 'reps');
  }, {label, decimal: field==='weight'});
}

/* Tap the number, type the number. Replaced the +/− stepper in v1.6.0 —
   pre-filled values mean the common case is no edit at all, and when an edit
   is needed, typing beats tapping +5 eleven times. */
function openNumpad(startVal, onSave, opts){
  opts = opts||{};
  const backdrop = document.createElement('div');
  backdrop.className='modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal-sheet">
      ${opts.label?`<div class="card-title" style="font-size:17px;">${opts.label}</div>`:''}
      <div class="center mt12">
        <input type="number" inputmode="${opts.decimal?'decimal':'numeric'}" id="numpad-input" class="bw-input"
               style="width:160px; font-size:32px;" value="${startVal!=null?startVal:''}">
      </div>
      <button class="pill-btn accent mt16" id="numpad-save">SAVE</button>
      <button class="pill-btn ghost mt8" id="numpad-cancel">CANCEL</button>
    </div>`;
  document.body.appendChild(backdrop);
  const inp = backdrop.querySelector('#numpad-input');
  setTimeout(()=>{ try{ inp.focus(); inp.select(); }catch(e){} }, 60);
  const close = ()=>{ if(backdrop.parentNode) document.body.removeChild(backdrop); };
  backdrop.querySelector('#numpad-save').onclick = ()=>{
    const v = parseFloat(inp.value);
    close();
    if(!isNaN(v) && v>=0) onSave(v);
  };
  backdrop.querySelector('#numpad-cancel').onclick = close;
  // Tapping outside the sheet is a Cancel, never a Save (v2.1).
  backdrop.addEventListener('click', e=>{ if(e.target===backdrop) close(); });
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') backdrop.querySelector('#numpad-save').click(); });
}

let restTimerInterval = null;
let restEndAt = null;
// Rest countdown anchored to an end timestamp. Every repaint computes remaining
// from Date.now(), so a phone that sleeps mid-rest shows the true time on wake
// (via renderRestTimer, called by the interval and by refreshTimers).
function startRestTimer(restSec){
  clearInterval(restTimerInterval);
  restEndAt = Date.now() + (restSec||60)*1000;
  if(sessionState) sessionState.restEndAt = restEndAt;
  renderRestTimer();
  restTimerInterval = setInterval(renderRestTimer, 250);
}
function renderRestTimer(){
  const wrap = document.getElementById('rest-timer-wrap');
  if(!wrap || restEndAt==null) return;
  const remaining = Math.round((restEndAt - Date.now())/1000);
  if(remaining<=0){
    clearInterval(restTimerInterval); restTimerInterval=null;
    const justExpired = remaining > -3; // don't fire a stale beep on wake long after
    restEndAt = null;
    if(sessionState) sessionState.restEndAt = null;
    wrap.innerHTML='';
    if(justExpired){
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
      beep();
    }
    return;
  }
  const m = Math.floor(remaining/60), s = remaining%60;
  const cls = remaining<=5 ? 'timer-pill final' : 'timer-pill';
  wrap.innerHTML = `<div class="card center"><div class="rest-label">Rest</div><div class="${cls}">${m}:${pad(s)}</div></div>`;
}
function beep(ms, freq){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = freq||880; g.gain.value = 0.2;
    o.start(); setTimeout(()=>{o.stop(); ctx.close();}, ms||300);
  }catch(e){}
}

function finishStrengthSession(){
  finisherTimer.stop();
  const fMin = sessionState.finisherMin!=null
    ? sessionState.finisherMin
    : (finisherTimer.elapsedSec()>0 ? finisherTimer.minutes() : 0);
  const proceed = ()=>{
    clearInterval(restTimerInterval); restTimerInterval=null; restEndAt=null;
    const work = sessionState.exercises.map(row=>({
      ex: row.ex.id,
      target: `${row.ex.sets||3}x${row.ex.repLo}-${row.ex.repHi}@${row.weight||row.ex.startWeight||0}`,
      sets: row.sets.filter(Boolean).map(s=>[s.weight,s.reps])
    }));
    const draft = {
      date: sessionState.date || todayStr(),
      slot: sessionState.variant.letter,
      readiness: sessionState.variant.readiness,
      work,
      startedAt: sessionState.startedAt
    };
    if(fMin>0){
      draft.finisher = { mode: sessionState.finisherMode||'incline_walk', min: fMin };
      // v2.1: vest only counts on a walk
      const fv = draft.finisher.mode==='incline_walk' ? finisherVestLb() : null;
      if(fv) draft.finisher.vest = fv;
    }
    // v2.0: record warmup completion and per-session steps when present.
    const wc = sessionState.warmChecks || [];
    if(wc.length) draft.warm = { done: wc.filter(Boolean).length, total: wc.length };
    if(sessionState.steps){
      const sa = parseInt(sessionState.steps.start,10), sb = parseInt(sessionState.steps.end,10);
      if(!isNaN(sa) && !isNaN(sb)) draft.steps = { start: sa, end: sb };
    }
    // A manual session has no timer to trust; seed a plausible duration and let
    // the Finish screen's editable field carry the real number.
    if(sessionState.manual){ draft.manual = true; draft.min = 45 + fMin; }
    // Timer kept (stopped, not reset) so Finish → Back restores it; a fresh session resets it (v2.1).
    Nav.toFinish(draft);
  };
  // The finisher is part of every strength session (§1) and Joel made it
  // non-skippable. Zero minutes gets one nudge, not a wall — the record stays
  // honest either way.
  if(fMin<=0){
    confirmSheet('No finisher logged',
      'Every strength session ends with 8–12 min of walking or carries. Log it, or finish without one?',
      'BACK TO SESSION', 'FINISH WITHOUT',
      ()=>{}, proceed);
    return;
  }
  proceed();
}

function renderCardioSession(variant){
  // Only a genuine resume keeps the running timer. A fresh or edited session
  // starts the timer clean so a previous session's clock can't leak in.
  if(!(sessionState && sessionState.restored)) cardioTimer.reset();
  const cfg = store.get('config');
  const menu = (cfg && cfg.cardioMenu) || ['incline_walk','bike','rower','stairs'];
  const defaultMin = variant.degraded ? 20 : 35;
  const stripe = variant.degraded ? `<span class="badge yellow">YELLOW — 20 min, easiest mode</span>` : `<span class="badge green">GREEN</span>`;
  const sel = sessionState ? sessionState.mode : null;   // pre-select on resume or edit
  const options = menu.map(m=>`<option value="${m}"${sel===m?' selected':''}>${labelMode(m)}</option>`).join('');
  return `
    <div class="screen active" style="padding-bottom:100px;">
      <div class="flex-between mt8" style="margin-bottom:12px;">
        <h1 class="title" style="margin-bottom:0;">Cardio</h1>
        ${stripe}
      </div>
      <div class="card">
        <div class="card-title" style="font-size:17px;margin-bottom:10px;">Mode</div>
        <select id="cardio-mode" onchange="setCardioMode(this.value)">${options}</select>
      </div>
      <div class="card center">
        <div class="timer-pill" id="cardio-timer">00:00</div>
        <div class="microcopy mt12">Conversational effort — could hold a phone call.</div>
        <div class="mt16" style="display:flex; gap:10px;">
          <button class="pill-btn accent small" id="cardio-toggle" onclick="toggleCardioTimer()">START</button>
        </div>

    </div></div>
